name: GEO platform connection checks
on:
  pull_request:
    branches: [codex/production-geo]
    paths:
      - 'app/api_connection_config.py'
      - 'app/api_controls.py'
      - 'app/api_metering.py'
      - 'app/config.py'
      - 'app/geo/**'
      - 'scripts/api_*schema.sql'
      - 'tests/test_api_connection_config.py'
      - 'tests/test_platform_call_guards.py'
      - '.github/workflows/platform-config-check.yml'
  push:
    branches: [codex/production-geo]
permissions:
  contents: read
jobs:
  connection-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: config_test
          POSTGRES_PASSWORD: config_ci_only
          POSTGRES_DB: platform_config_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U config_test -d platform_config_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Verify native connection isolation, encryption, versions and recovery
        env:
          PLATFORM_CONSOLE_TEST_DATABASE_URL: postgresql+asyncpg://config_test:config_ci_only@127.0.0.1:5432/platform_config_test
          DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:1/test
          BAIDU_APP_ID: ci-dummy
          BAIDU_SECRET_KEY: ci-dummy-secret
          BAIDU_DEFAULT_USERNAME: ci-dummy
          BAIDU_DEFAULT_UCID: '1'
          BAIDU_SELF_ACCESS_TOKEN: ci-dummy
          BAIDU_SELF_TOKEN_EXPIRES_AT: '2099-01-01T00:00:00Z'
          CRYPTO_MASTER_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ADMIN_API_KEY: ci-dummy-admin
        run: >-
          python -m pytest -q
          tests/test_api_connection_config.py
          tests/test_platform_call_guards.py
