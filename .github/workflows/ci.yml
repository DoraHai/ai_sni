name: CI

on:
  push:
    branches: [main, codex/production-sem]
  pull_request:
    # SEO production PRs run through the isolated SEO baseline workflow.
    branches-ignore:
      - codex/production-seo

jobs:
  repository-lineage:
    name: Repository / shared main-SEO lineage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a merge-base with the SEO production branch
        run: |
          git fetch --no-tags origin codex/production-seo
          git merge-base HEAD origin/codex/production-seo

  migration-validation:
    name: Repository / migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate the single migration head and a fresh upgrade
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
          SEO_MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
          BAIDU_APP_ID: ci-dummy
          BAIDU_SECRET_KEY: 1234567890abcdef
          BAIDU_DEFAULT_USERNAME: ci-dummy
          BAIDU_DEFAULT_UCID: "1"
          BAIDU_SELF_ACCESS_TOKEN: ci-dummy
          BAIDU_SELF_TOKEN_EXPIRES_AT: "2099-01-01T00:00:00+00:00"
          CRYPTO_MASTER_KEY_B64: j/QGqbWO8IVw9cCVeAq+u/alTyjLsSQXjROH9uW/3tA=
          ADMIN_API_KEY: ci-admin-key
        run: |
          heads="$(python -m alembic heads)"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          printf '%s\n' "$heads" | grep -F '0085_seo_page_index_reviews (head)'
          pytest -q tests/test_seo_migration_merge.py

  sem-logrotate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install logrotate parser
        run: |
          if ! command -v logrotate >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y logrotate
          fi

      - name: Parse SEM backend logrotate policy without changing logs
        run: |
          sudo install -o root -g root -m 0644 \
            deploy/sem-backend.logrotate "$RUNNER_TEMP/sem-backend.logrotate"
          sudo logrotate --debug --state /dev/null \
            "$RUNNER_TEMP/sem-backend.logrotate"

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          BAIDU_APP_ID: ci-dummy
          BAIDU_SECRET_KEY: ci-dummy-secret1
          BAIDU_DEFAULT_USERNAME: ci-dummy
          BAIDU_DEFAULT_UCID: "1"
          BAIDU_SELF_ACCESS_TOKEN: ci-dummy
          BAIDU_SELF_TOKEN_EXPIRES_AT: "2099-01-01T00:00:00+00:00"
          # 32-byte AES key, standard base64 (tests never use live crypto)
          CRYPTO_MASTER_KEY_B64: j/QGqbWO8IVw9cCVeAq+u/alTyjLsSQXjROH9uW/3tA=
          ADMIN_API_KEY: ci-admin-key
        run: python -m pytest -q tests

  sem-frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test stale chunk recovery
        working-directory: frontend
        run: npm run test:chunk-recovery

      - name: Test SEM identity repair request cancellation
        working-directory: frontend
        run: npm run test:sem-identity-repair-requests

      - name: Test SEM date and UI contracts
        working-directory: frontend
        run: npm run test:sem-date-time && npm run test:sem-ui-contracts && npm run test:sem-action-ledger

      - name: Verify build contract
        working-directory: frontend
        run: npm run verify:sem-build

  # Only runs on a real push to the production branch, and only after both
  # checks above pass. Never runs for pull_request events — a PR must be
  # merged first. 铁律 1: nothing gets deployed from an untested or
  # unmerged state; every deploy traces back to a commit on this branch.
  deploy-sem:
    name: Deploy SEM frontend only
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/production-sem'
    needs: [pytest, sem-frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-sem-frontend-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Require current SEM frontend production head
        env:
          RELEASE_BRANCH: codex/production-sem
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          latest="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
          test -n "$latest"
          if [[ "$latest" != "$RELEASE_SHA" ]]; then
            echo "Refusing stale SEM frontend release: requested=$RELEASE_SHA production=$latest" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Load the dedicated, unprivileged SEM deployment key. This key belongs
      # to sem-deploy and cannot operate the other product modules.
      - name: Set up deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SEM_DEPLOY_SSH_KEY }}

      - name: Trust the pinned deploy host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # deploy-sem.sh does build -> verify -> rsync to a new timestamped
      # release dir -> remote re-verification of required/forbidden
      # markers -> atomic symlink swap -> post-swap confirmation. See the
      # script itself and CLAUDE.md 铁律 1/6 for what each step guards
      # against; do not shortcut any of these steps in this workflow.
      - name: Deploy frontend (backend is a separate reviewed release)
        working-directory: frontend
        env:
          DEPLOY_TARGET: sem-deploy@101.200.193.83
          SEM_RELEASE_BRANCH: codex/production-sem
        run: bash scripts/deploy-sem.sh
