name: CI

on:
  push:
    branches: [main, codex/production-sem]
  pull_request:
    # SEO production PRs run through the isolated SEO baseline workflow.
    branches-ignore:
      - codex/production-seo

jobs:
  sem-task-contracts:
    name: SEM task native database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sem_task_test
          POSTGRES_PASSWORD: sem_task_ci_only
          POSTGRES_DB: sem_tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sem_task_test -d sem_tasks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Test task API and native transaction isolation
        env:
          SEM_TASK_TEST_DATABASE_URL: postgresql+asyncpg://sem_task_test:sem_task_ci_only@127.0.0.1:5432/sem_tasks_test
        run: python -m pytest -q tests/test_sem_tasks.py tests/test_sem_tasks_postgres.py
  dependency-audit:
    name: Dependencies / OSV production lockfile
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a # v2.5.0
    with:
      scan-args: |-
        --lockfile=./frontend/package-lock.json
      fail-on-vuln: true
      upload-sarif: false

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sem-test-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sem_test
          POSTGRES_PASSWORD: sem_ci_only
          POSTGRES_DB: sem_writeback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sem_test -d sem_writeback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run SEM non-funds native writeback races without skips
        env:
          SEM_ALERT_TEST_DATABASE_URL: postgresql+asyncpg://sem_test:sem_ci_only@127.0.0.1:5432/sem_writeback_test
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          BAIDU_APP_ID: ci-dummy
          BAIDU_SECRET_KEY: ci-dummy-secret1
          BAIDU_DEFAULT_USERNAME: ci-dummy
          BAIDU_DEFAULT_UCID: "1"
          BAIDU_SELF_ACCESS_TOKEN: ci-dummy
          BAIDU_SELF_TOKEN_EXPIRES_AT: "2099-01-01T00:00:00+00:00"
          CRYPTO_MASTER_KEY_B64: j/QGqbWO8IVw9cCVeAq+u/alTyjLsSQXjROH9uW/3tA=
          ADMIN_API_KEY: ci-admin-key
        run: |
          python -m pytest -q tests/test_sem_nonfunds_writeback_postgres.py \
            --junitxml="$RUNNER_TEMP/sem-nonfunds-writeback.xml"
          python - "$RUNNER_TEMP/sem-nonfunds-writeback.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          expected = {
              "test_reconciler_wins_during_commit_relock_gap_and_executor_stays_stopped",
              "test_account_disable_after_manual_reconciliation_preserves_decision",
              "test_schedule_intent_blocks_concurrent_campaign_pause_domain",
              "test_full_list_sync_in_commit_relock_gap_blocks_stale_remote_overwrite",
              "test_add_word_success_in_commit_relock_gap_blocks_duplicate_remote_call",
              "test_add_word_recheck_sees_other_session_success_before_remote_call",
              "test_two_live_add_word_attempts_from_empty_state_call_remote_once",
              "test_match_combo_sync_in_commit_relock_gap_blocks_remote_overwrite",
              "test_dry_run_add_word_does_not_block_later_live_request",
              "test_batch_negative_recomputes_from_latest_list_after_intent_commit",
              "test_pause_final_commit_failure_keeps_durable_pre_send_audit",
          }
          cases = list(root.iter("testcase"))
          names = {case.attrib["name"] for case in cases}
          skipped = sum(case.find("skipped") is not None for case in cases)
          failed = sum(
              case.find("failure") is not None or case.find("error") is not None
              for case in cases
          )
          assert len(cases) == len(expected) and names == expected and skipped == failed == 0, (
              len(cases), skipped, failed,
              sorted(expected - names), sorted(names - expected)
          )
          PY

      - name: Run tests
        env:
          # Disposable CI service; application DATABASE_URL stays separate.
          SEM_ALERT_TEST_DATABASE_URL: postgresql+asyncpg://sem_test:sem_ci_only@127.0.0.1:5432/sem_writeback_test
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          BAIDU_APP_ID: ci-dummy
          BAIDU_SECRET_KEY: ci-dummy-secret1
          BAIDU_DEFAULT_USERNAME: ci-dummy
          BAIDU_DEFAULT_UCID: "1"
          BAIDU_SELF_ACCESS_TOKEN: ci-dummy
          BAIDU_SELF_TOKEN_EXPIRES_AT: "2099-01-01T00:00:00+00:00"
          # 32-byte AES key, standard base64 (tests never use live crypto)
          CRYPTO_MASTER_KEY_B64: j/QGqbWO8IVw9cCVeAq+u/alTyjLsSQXjROH9uW/3tA=
          ADMIN_API_KEY: ci-admin-key
        run: python -m pytest -q tests

  sem-foundation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sem_test
          POSTGRES_PASSWORD: sem_test_only
          POSTGRES_DB: sem_foundation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sem_test -d sem_foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate SEM metric contract and native idempotency transactions
        env:
          SEM_FOUNDATION_TEST_DATABASE_URL: postgresql+asyncpg://sem_test:sem_test_only@127.0.0.1:5432/sem_foundation_test
          DASHSCOPE_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          GEO_OPENAI_API_KEY: ""
        run: python -m pytest -q tests/test_sem_foundation_contracts.py tests/test_sem_foundation_postgres.py tests/test_writeback_approval.py

  sem-frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # Dependency vulnerability checking is handled by the pinned OSV job.
        run: npm ci --no-audit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test stale chunk recovery
        working-directory: frontend
        run: npm run test:chunk-recovery

      - name: Test SEM identity repair request cancellation
        working-directory: frontend
        run: npm run test:sem-identity-repair-requests

      - name: Verify build contract
        working-directory: frontend
        run: npm run verify:sem-build

  # Only runs on a real push to the production branch, and only after both
  # checks above pass. Never runs for pull_request events — a PR must be
  # merged first. 铁律 1: nothing gets deployed from an untested or
  # unmerged state; every deploy traces back to a commit on this branch.
  deploy-sem:
    name: Deploy SEM frontend only
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/production-sem'
    needs: [pytest, sem-frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Load the dedicated, unprivileged SEM deployment key. This key belongs
      # to sem-deploy and cannot operate the other product modules.
      - name: Set up deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SEM_DEPLOY_SSH_KEY }}

      - name: Trust the pinned deploy host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # deploy-sem.sh does build -> verify -> rsync to a new timestamped
      # release dir -> remote re-verification of required/forbidden
      # markers -> atomic symlink swap -> post-swap confirmation. See the
      # script itself and CLAUDE.md 铁律 1/6 for what each step guards
      # against; do not shortcut any of these steps in this workflow.
      - name: Deploy frontend (backend is a separate reviewed release)
        working-directory: frontend
        env:
          DEPLOY_TARGET: sem-deploy@101.200.193.83
        run: bash scripts/deploy-sem.sh
