name: SEO workbench consumer checks

on:
  pull_request:
    paths:
      - 'integrations/seo-workbench/**'
      - 'integrations/workbench/**'
      - '.github/workflows/seo-workbench-consumer-check.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/seo-workbench/**'
      - 'integrations/workbench/**'
      - '.github/workflows/seo-workbench-consumer-check.yml'

permissions:
  contents: read

jobs:
  consumer:
    name: SEO readonly consumer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate readonly scope, references and failure states offline
        run: node --test integrations/seo-workbench/readonly-client.test.mjs integrations/seo-workbench/authorization-context.test.mjs integrations/workbench/seo-transport.test.mjs
