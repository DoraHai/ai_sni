name: GEO baseline check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/production-geo
  pull_request:
    paths:
      - "app/geo/**"
      - "app/geo_main.py"
      - "app/models/**"
      - "frontend/geo-frontend/**"
      - "frontend/src/api/**"
      - "frontend/src/views/geo/**"
      - "frontend/src/components/Geo*.vue"
      - "frontend/src/utils/geo*"
      - "frontend/tests/geo*.test.mjs"
      - ".github/workflows/geo-baseline-check.yml"
      - "migrations/versions/**"
      - "ops/platform-deploy/modules/geo"
      - ".github/workflows/production-geo-deploy.yml"
      - "tests/test_geo_*.py"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run GEO regression tests
        env:
          PYTHONPATH: .
          TZ: UTC
        run: >-
          pytest -q
          tests/test_geo_content_task_create.py
          tests/test_geo_daily_metrics_slices.py
          tests/test_geo_ai_sampling.py
          tests/test_geo_audit.py
          tests/test_geo_brand_profile.py
          tests/test_geo_chinaz.py
          tests/test_geo_content_rules.py
          tests/test_geo_evidence_cite.py
          tests/test_geo_pagespeed.py
          tests/test_geo_release_isolation.py
          tests/test_geo_site_audit.py
          tests/test_geo_job_ownership.py
          tests/test_geo_flow_integration.py
          tests/test_geo_work_queue_tickets.py
          tests/test_geo_work_execution.py
          tests/test_geo_execution_plan.py
          tests/test_geo_article_save.py
          tests/test_geo_source_opportunity_tasks.py
          tests/test_geo_source_opportunities.py
          tests/test_geo_sample_provenance.py
          tests/test_geo_unprimed_probe.py
          tests/test_geo_probe_batch.py
          tests/test_geo_tenant_switcher.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/geo-frontend/package-lock.json
      - name: Install shared frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build independent GEO frontend
        working-directory: frontend/geo-frontend
        run: npm ci && npm run build
      - name: GEO frontend contracts
        working-directory: frontend
        run: node --test tests/geo*.test.mjs
