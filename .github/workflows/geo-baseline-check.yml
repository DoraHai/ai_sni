name: GEO baseline check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/production-geo
      - codex/geo-generation-pg-verify-20260907
  pull_request:
    paths:
      - "app/geo/**"
      - "app/geo_main.py"
      - "app/models/**"
      - "frontend/geo-frontend/**"
      - "frontend/src/api/**"
      - "frontend/src/views/geo/**"
      - "frontend/src/components/Geo*.vue"
      - "frontend/src/utils/geo*"
      - "frontend/tests/geo*.test.mjs"
      - ".github/workflows/geo-baseline-check.yml"
      - "migrations/versions/**"
      - "ops/platform-deploy/modules/geo"
      - ".github/workflows/production-geo-deploy.yml"
      - "tests/test_geo*.py"
      - "ops/run_geo_checks.py"
      - "tests/test_metric_service.py"
      - "tests/test_md_to_html_tables.py"
      - "tests/test_channel_article_quality.py"

permissions:
  contents: read

jobs:
  backend-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geo_ci
          POSTGRES_PASSWORD: geo_ci_test
          POSTGRES_DB: geo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geo_ci -d geo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run all GEO regressions including PostgreSQL concurrency
        env:
          GEO_TEST_POSTGRES_URL: postgresql+asyncpg://geo_ci:geo_ci_test@127.0.0.1:5432/geo_ci
        run: python ops/run_geo_checks.py --postgres


  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/geo-frontend/package-lock.json
      - name: Install shared frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build independent GEO frontend
        working-directory: frontend/geo-frontend
        run: npm ci && npm run build
      - name: GEO frontend contracts
        working-directory: frontend
        run: node --test tests/geo*.test.mjs
