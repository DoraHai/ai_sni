name: SEO baseline check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/production-seo
  pull_request:
    branches:
      - codex/production-seo

permissions:
  contents: read

jobs:
  dependency-audit:
    name: SEO / OSV production lockfile
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a # v2.5.0
    with:
      scan-args: |-
        --lockfile=./frontend/package-lock.json
      fail-on-vuln: true
      upload-sarif: false

  scope-boundary:
    name: SEO / scope-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the authoritative SEO production history
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          expected_branch="codex/production-seo"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$PR_BASE_REF" = "$expected_branch"
          else
            test "$REF_NAME" = "$expected_branch"
          fi
          if [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git merge-base --is-ancestor "$PUSH_BEFORE_SHA" HEAD
          fi
      - name: Reject non-SEO source changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="HEAD^"
          fi
          python scripts/verify_seo_release.py source-diff --base "$base" --head HEAD

  backend-tests:
    name: SEO / backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run SEO regression tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          BAIDU_APP_ID: ci-dummy
          BAIDU_SECRET_KEY: 1234567890abcdef
          BAIDU_DEFAULT_USERNAME: ci-dummy
          BAIDU_DEFAULT_UCID: "1"
          BAIDU_SELF_ACCESS_TOKEN: ci-dummy
          BAIDU_SELF_TOKEN_EXPIRES_AT: "2099-01-01T00:00:00+00:00"
          CRYPTO_MASTER_KEY_B64: j/QGqbWO8IVw9cCVeAq+u/alTyjLsSQXjROH9uW/3tA=
          ADMIN_API_KEY: ci-admin-key
          PYTHONPATH: .
          TZ: UTC
        run: >-
          pytest -q
          tests/test_keyword_refresh.py
          tests/test_module_workspaces.py
          tests/test_process_lock.py
          tests/test_seo_crawler.py
          tests/test_seo_single_page_audit.py
          tests/test_seo_automation_runs.py
          tests/test_seo_manual_automation.py
          tests/test_seo_competitors.py
          tests/test_seo_deploy_isolation.py
          tests/test_seo_distribution.py
          tests/test_seo_domestic_distribution.py
          tests/test_seo_backlink_sources.py
          tests/test_seo_backlink_opportunities.py
          tests/test_seo_publisher_runner.py
          tests/test_seo_distribution_import.py
          tests/test_seo_cockpit.py
          tests/test_seo_cockpit_auth.py
          tests/test_seo_video_platforms.py
          tests/test_seo_backlink_workflow.py
          tests/test_seo_foundation.py
          tests/test_seo_rank_limits.py
          tests/test_seo_rank_optimization.py
          tests/test_seo_release_consistency.py
          tests/test_seo_scheduler.py
          tests/test_seo_serp.py
          tests/test_seo_site_association.py
          tests/test_seo_site_diagnostics.py
          tests/test_seo_remediation.py
          tests/test_seo_traffic.py
          tests/test_seo_monitoring_jobs.py
          tests/test_seo_usage_limits.py
          tests/test_urlwords.py

      - name: Exercise local publisher in Chromium fixtures
        env:
          SEO_RUNNER_BROWSER_TEST: "1"
        run: |
          pip install -r frontend/src/views/seo/publisher-runner/requirements.txt
          python -m playwright install --with-deps --no-shell chromium
          pytest -q tests/test_seo_publisher_runner.py

  frontend-build:
    name: SEO / frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 10 still calls the retiring quick-audit endpoint and can reject
          # a clean npm-ci tree as "Invalid package tree". Node 24 ships npm 11,
          # which uses the supported audit endpoint while preserving the gate.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit
      - name: Build isolated SEO frontend
        working-directory: frontend
        run: node --test scripts/test-seo-ai-requests.mjs && node scripts/test-seo-task-center.mjs && node --test scripts/test-seo-publisher.mjs scripts/test-seo-backlinks.mjs scripts/test-seo-video-workflow.mjs && node scripts/test-seo-diagnostics.mjs && node scripts/test-seo-remediation.mjs && npm run test:seo-editor && npm run build:seo
      - name: Verify isolated SEO frontend
        working-directory: frontend
        run: npm run verify:seo-build

  migration-validation:
    name: SEO / migration-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Require the reviewed single Alembic head
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
          SEO_MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
          SEO_USAGE_TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/test
          BAIDU_APP_ID: ci-dummy
          BAIDU_SECRET_KEY: 1234567890abcdef
          BAIDU_DEFAULT_USERNAME: ci-dummy
          BAIDU_DEFAULT_UCID: "1"
          BAIDU_SELF_ACCESS_TOKEN: ci-dummy
          BAIDU_SELF_TOKEN_EXPIRES_AT: "2099-01-01T00:00:00+00:00"
          CRYPTO_MASTER_KEY_B64: j/QGqbWO8IVw9cCVeAq+u/alTyjLsSQXjROH9uW/3tA=
          ADMIN_API_KEY: ci-admin-key
        run: |
          heads="$(python -m alembic heads)"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          printf '%s\n' "$heads" | grep -F '0092_seo_cockpit (head)'
          python -m pytest -q tests/test_seo_migration_merge.py tests/test_seo_video_platforms.py tests/test_seo_backlink_workflow.py tests/test_seo_cockpit.py tests/test_seo_cockpit_auth.py tests/test_seo_usage_limits.py tests/test_seo_ai_operations.py tests/test_seo_task_center.py
