name: Platform console backend checks

on:
  pull_request:
    branches: [codex/production-sem-backend]
    paths:
      - 'app/api/platform_console.py'
      - 'app/platform_history.py'
      - 'app/platform_operations.py'
      - 'app/api/users.py'
      - 'app/api/roles.py'
      - 'scripts/platform_database_backup.py'
      - 'tests/test_platform_operations.py'
      - 'app/api_metering.py'
      - 'app/api_controls.py'
      - 'app/api_connection_config.py'
      - 'app/config.py'
      - 'tests/test_api_connection_config.py'
      - 'scripts/api_controls_schema.sql'
      - 'scripts/api_controls_permissions.sql'
      - 'tests/test_api_controls.py'
      - 'app/api_cost_summary.py'
      - 'app/security/auth.py'
      - 'app/ai/deepseek.py'
      - 'app/baidu/client.py'
      - 'scripts/api_metering_schema.sql'
      - 'tests/test_api_metering.py'
      - 'app/main.py'
      - 'tests/test_platform_console.py'
      - '.github/workflows/platform-console-check.yml'
  push:
    branches: [codex/production-sem-backend]
    paths:
      - 'app/api/platform_console.py'
      - 'app/platform_history.py'
      - 'app/platform_operations.py'
      - 'app/api/users.py'
      - 'app/api/roles.py'
      - 'scripts/platform_database_backup.py'
      - 'tests/test_platform_operations.py'
      - 'app/api_metering.py'
      - 'app/api_controls.py'
      - 'app/api_connection_config.py'
      - 'app/config.py'
      - 'tests/test_api_connection_config.py'
      - 'scripts/api_controls_schema.sql'
      - 'scripts/api_controls_permissions.sql'
      - 'tests/test_api_controls.py'
      - 'app/api_cost_summary.py'
      - 'app/security/auth.py'
      - 'app/ai/deepseek.py'
      - 'app/baidu/client.py'
      - 'scripts/api_metering_schema.sql'
      - 'tests/test_api_metering.py'
      - 'app/main.py'
      - 'tests/test_platform_console.py'
      - '.github/workflows/platform-console-check.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: console_test
          POSTGRES_PASSWORD: console_ci_only
          POSTGRES_DB: platform_console_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U console_test -d platform_console_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify permissions, read-only inventory and existing isolation
        env:
          PLATFORM_CONSOLE_TEST_DATABASE_URL: postgresql+asyncpg://console_test:console_ci_only@127.0.0.1:5432/platform_console_test
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          BAIDU_APP_ID: ci-dummy
          BAIDU_SECRET_KEY: ci-dummy-secret1
          BAIDU_DEFAULT_USERNAME: ci-dummy
          BAIDU_DEFAULT_UCID: '1'
          BAIDU_SELF_ACCESS_TOKEN: ci-dummy
          BAIDU_SELF_TOKEN_EXPIRES_AT: '2099-01-01T00:00:00+00:00'
          CRYPTO_MASTER_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ADMIN_API_KEY: ci-admin-key
        run: >-
          python -m pytest -q tests/test_platform_console.py tests/test_platform_operations.py tests/test_api_metering.py tests/test_api_controls.py tests/test_api_connection_config.py tests/test_module_workspaces.py
          tests/test_prod_guard.py tests/test_tenant_isolation.py tests/test_sem_release_isolation.py
          tests/test_writeback_guardrail_contract.py
