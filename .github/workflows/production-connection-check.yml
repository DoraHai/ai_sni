name: Production deployment connection check

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CHECK to verify the production deployment channel
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment-connection-check
  cancel-in-progress: false

jobs:
  check:
    name: Check restricted production access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Validate confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "CHECK" || {
            echo "Confirmation must be CHECK" >&2
            exit 2
          }

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/platform-deploy
          chmod 600 ~/.ssh/platform-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify restricted deployment channel
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/platform-deploy \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo -n /usr/local/sbin/platform-deploy status'
