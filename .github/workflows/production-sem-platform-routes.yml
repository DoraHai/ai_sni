name: Production SEM platform routes

on:
  pull_request:
    branches: [codex/production-sem]
    paths:
      - deploy/gsnipers-platform-routes.conf
      - ops/platform-deploy/install-platform-routes.sh
      - ops/platform-deploy/modules/platform
      - ops/platform-deploy/publish-platform-routes.sh
      - tests/fixtures/gsnipers-platform-routes-reviewed-base.conf
      - tests/test_platform_route_release.py
      - .github/workflows/production-sem-platform-routes.yml
  push:
    branches: [codex/production-sem]
    paths:
      - deploy/gsnipers-platform-routes.conf
      - ops/platform-deploy/install-platform-routes.sh
      - ops/platform-deploy/modules/platform
      - ops/platform-deploy/publish-platform-routes.sh
      - tests/fixtures/gsnipers-platform-routes-reviewed-base.conf
      - tests/test_platform_route_release.py
      - .github/workflows/production-sem-platform-routes.yml

permissions:
  contents: read
concurrency:
  group: production-sem-platform-routes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Require exact source commit
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$(git ls-remote origin refs/heads/codex/production-sem | cut -f1)" = "$RELEASE_SHA"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install route test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate route config and release state machine contracts
        run: |
          bash -n ops/platform-deploy/modules/platform
          bash -n ops/platform-deploy/install-platform-routes.sh
          bash -n ops/platform-deploy/publish-platform-routes.sh
          python -m pytest -q tests/test_platform_route_release.py
      - name: Create immutable config release
        if: github.event_name == 'push'
        run: |
          root="$RUNNER_TEMP/platform-routes-release"
          install -d "$root"
          cp deploy/gsnipers-platform-routes.conf "$root/gsnipers.conf"
          {
            echo 'module=platform-routes'
            echo "commit=$RELEASE_SHA"
            echo 'migration=not-run'
            echo 'frontend=not-included'
            echo 'backend=not-included'
          } > "$root/MANIFEST"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/platform-routes-${RELEASE_SHA}.tgz" platform-routes-release
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: platform-routes-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/platform-routes-${{ env.RELEASE_SHA }}.tgz
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/production-sem'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reject a stale production head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git ls-remote origin refs/heads/codex/production-sem | cut -f1)" = "${{ github.sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: platform-routes-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Configure restricted production identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/platform-deploy
          chmod 600 ~/.ssh/platform-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and apply the exact route package
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          archive="$RUNNER_TEMP/platform-routes-${{ github.sha }}.tgz"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          ops/platform-deploy/publish-platform-routes.sh "$archive" "${{ github.sha }}" "$digest"
