name: SEM writeback alert integration
on:
  pull_request:
    paths:
      - app/rules/writeback_health.py
      - app/scheduler.py
      - tests/test_sem_writeback_health*.py
      - .github/workflows/sem-writeback-alert-tests.yml
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sem_writeback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d sem_writeback_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests/test_sem_writeback_health.py tests/test_sem_writeback_health_postgres.py
        env:
          SEM_ALERT_TEST_DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/sem_writeback_test
