name: Production GEO deployment

on:
  push:
    branches:
      - codex/production-geo
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_GEO to publish the approved GEO baseline
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-geo-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify GEO baseline
    if: github.ref_name == 'codex/production-geo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Run GEO regression tests
        env:
          PYTHONPATH: .
          TZ: UTC
        run: >-
          pytest -q
          tests/test_geo_content_task_create.py
          tests/test_geo_daily_metrics_slices.py
          tests/test_geo_ai_sampling.py
          tests/test_geo_audit.py
          tests/test_geo_brand_profile.py
          tests/test_geo_chinaz.py
          tests/test_geo_content_rules.py
          tests/test_geo_evidence_cite.py
          tests/test_geo_pagespeed.py
          tests/test_geo_release_isolation.py
          tests/test_geo_site_audit.py
          tests/test_geo_job_ownership.py
          tests/test_geo_flow_integration.py
          tests/test_geo_work_queue_tickets.py
          tests/test_geo_work_execution.py
          tests/test_geo_execution_plan.py
          tests/test_geo_article_save.py
          tests/test_geo_execution_review.py
          tests/test_geo_webhook_connector.py
          tests/test_geo_integration.py
          tests/test_geo_core_review_fixes.py
          tests/test_geo_source_opportunity_tasks.py
          tests/test_geo_source_opportunities.py
          tests/test_geo_sample_provenance.py
          tests/test_geo_unprimed_probe.py
          tests/test_geo_probe_batch.py
          tests/test_geo_tenant_switcher.py

  deploy:
    name: Build and deploy GEO only
    if: github.ref_name == 'codex/production-geo'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Validate confirmation
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRMATION" != "DEPLOY_GEO" ]; then
            echo "Confirmation must be DEPLOY_GEO" >&2
            exit 2
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/geo-frontend/package-lock.json

      - name: Install shared frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build independent GEO frontend
        working-directory: frontend/geo-frontend
        run: npm ci && npm run build

      - name: Verify GEO frontend regressions before deployment
        working-directory: frontend
        run: node --test tests/geo*.test.mjs

      - name: Create isolated GEO release archive
        run: |
          commit="$(git rev-parse HEAD)"
          release_root="$RUNNER_TEMP/geo-release"
          install -d "$release_root/backend" "$release_root/frontend"
          cp -a app "$release_root/backend/app"
          cp -a migrations "$release_root/backend/migrations"
          cp requirements.txt alembic.ini "$release_root/backend/"
          cp -a frontend/geo-frontend/dist/. "$release_root/frontend/"
          {
            echo 'module=geo'
            echo "commit=$commit"
            echo 'migration=not-run'
          } > "$release_root/MANIFEST"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/geo-${commit}.tgz" geo-release
          echo "GEO_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "GEO_ARCHIVE=$RUNNER_TEMP/geo-${commit}.tgz" >> "$GITHUB_ENV"
          echo "GEO_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/geo-${commit}.tgz" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/platform-deploy
          chmod 600 ~/.ssh/platform-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload GEO release archive
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_path="/home/platform-deploy/uploads/geo-${GEO_COMMIT}.tgz"
          scp \
            -i ~/.ssh/platform-deploy \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$GEO_ARCHIVE" \
            "$DEPLOY_USER@$DEPLOY_HOST:${remote_path}.part"
          ssh \
            -i ~/.ssh/platform-deploy \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mv '${remote_path}.part' '$remote_path'"

      - name: Apply GEO release without database migration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_path="/home/platform-deploy/uploads/geo-${GEO_COMMIT}.tgz"
          ssh \
            -i ~/.ssh/platform-deploy \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/platform-deploy apply geo '$remote_path' '$GEO_COMMIT' '$GEO_ARCHIVE_SHA256' DEPLOY_GEO"
