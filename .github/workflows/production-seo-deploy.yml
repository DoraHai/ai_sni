name: Production SEO deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_SEO after the release scope has been approved
        required: true
        type: string
      expected_sha:
        description: Full approved commit SHA from codex/production-seo
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-seo-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify approved SEO release
    if: github.ref_name == 'codex/production-seo'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate branch, confirmation, and commit
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          test "$CONFIRMATION" = "DEPLOY_SEO"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          test "${#EXPECTED_SHA}" -eq 40

      - uses: actions/checkout@v4
        with:
          ref: codex/production-seo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify SEO backend and deployment isolation
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          BAIDU_APP_ID: ci-dummy
          BAIDU_SECRET_KEY: 1234567890abcdef
          BAIDU_DEFAULT_USERNAME: ci-dummy
          BAIDU_DEFAULT_UCID: "1"
          BAIDU_SELF_ACCESS_TOKEN: ci-dummy
          BAIDU_SELF_TOKEN_EXPIRES_AT: "2099-01-01T00:00:00+00:00"
          CRYPTO_MASTER_KEY_B64: j/QGqbWO8IVw9cCVeAq+u/alTyjLsSQXjROH9uW/3tA=
          ADMIN_API_KEY: ci-admin-key
          PYTHONPATH: .
          TZ: UTC
        run: >-
          pytest -q
          tests/test_keyword_refresh.py
          tests/test_module_workspaces.py
          tests/test_process_lock.py
          tests/test_seo_crawler.py
          tests/test_seo_deploy_isolation.py
          tests/test_seo_distribution.py
          tests/test_seo_distribution_import.py
          tests/test_seo_foundation.py
          tests/test_seo_release_consistency.py
          tests/test_seo_serp.py

      - name: Verify reviewed migration head without applying migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          BAIDU_APP_ID: ci-dummy
          BAIDU_SECRET_KEY: 1234567890abcdef
          BAIDU_DEFAULT_USERNAME: ci-dummy
          BAIDU_DEFAULT_UCID: "1"
          BAIDU_SELF_ACCESS_TOKEN: ci-dummy
          BAIDU_SELF_TOKEN_EXPIRES_AT: "2099-01-01T00:00:00+00:00"
          CRYPTO_MASTER_KEY_B64: j/QGqbWO8IVw9cCVeAq+u/alTyjLsSQXjROH9uW/3tA=
          ADMIN_API_KEY: ci-admin-key
        run: |
          heads="$(python -m alembic heads)"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          printf '%s\n' "$heads" | grep -F '0073_seo_distribution_variants (head)'

      - working-directory: frontend
        run: npm ci
      - name: Build and verify isolated SEO frontend
        working-directory: frontend
        run: npm run build:seo && npm run verify:seo-build

      - name: Create isolated SEO release archive
        run: |
          commit="$(git rev-parse HEAD)"
          test "$commit" = "${{ inputs.expected_sha }}"
          release_root="$RUNNER_TEMP/seo-release"
          install -d "$release_root/backend" "$release_root/frontend"
          cp -a app "$release_root/backend/app"
          cp -a migrations "$release_root/backend/migrations"
          cp requirements.txt alembic.ini "$release_root/backend/"
          cp -a frontend/dist-seo/. "$release_root/frontend/"
          {
            echo 'module=seo'
            echo "commit=$commit"
            echo 'migration=not-run'
          } > "$release_root/MANIFEST"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/seo-${commit}.tgz" seo-release
          sha256sum "$RUNNER_TEMP/seo-${commit}.tgz" > "$RUNNER_TEMP/seo-${commit}.tgz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: seo-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/seo-${{ github.sha }}.tgz
            ${{ runner.temp }}/seo-${{ github.sha }}.tgz.sha256
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy SEO only after environment approval
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-seo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seo-release-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Configure restricted SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/platform-deploy
          chmod 600 ~/.ssh/platform-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload immutable SEO release archive
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SEO_COMMIT: ${{ github.sha }}
        run: |
          archive="$RUNNER_TEMP/seo-${SEO_COMMIT}.tgz"
          remote_path="/home/platform-deploy/uploads/seo-${SEO_COMMIT}.tgz"
          scp -i ~/.ssh/platform-deploy -P "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$archive" "$DEPLOY_USER@$DEPLOY_HOST:${remote_path}.part"
          ssh -i ~/.ssh/platform-deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mv '${remote_path}.part' '$remote_path'"

      - name: Apply SEO release without database migration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SEO_COMMIT: ${{ github.sha }}
        run: |
          archive="$RUNNER_TEMP/seo-${SEO_COMMIT}.tgz"
          archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          remote_path="/home/platform-deploy/uploads/seo-${SEO_COMMIT}.tgz"
          ssh -i ~/.ssh/platform-deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n /usr/local/sbin/platform-deploy apply seo '$remote_path' '$SEO_COMMIT' '$archive_sha256' DEPLOY_SEO"
