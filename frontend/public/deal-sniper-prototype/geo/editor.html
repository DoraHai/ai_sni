<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO 编辑器</title>
<link rel="stylesheet" href="assets/style.css?rev=geo-wb-2">
<link rel="stylesheet" href="assets/geo-workbench-v1.css?rev=9">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>在线编辑器</h1>
        <div class="sub">事实绑定 → 生成母稿 → 规则检查 → 渠道适配</div>
      </div>
      <div class="right" id="taskStatus"></div>
    </div>
    <div class="page">
      <div id="authBar" class="config-bar"></div>
      <div id="err" class="wb-error" style="display:none"></div>
      <div id="blockedBar" class="wb-gate-bar" style="display:none"></div>
      <div id="pipelineBar" class="wb-pipeline"></div>
      <div class="wb-card">
        <div class="wb-muted" id="promptLine">目标问题：-</div>
        <div style="margin-top:10px" id="factChips"></div>
        <div class="wb-toolbar">
          <select class="wb-select" id="factSelect" style="max-width:280px"></select>
          <button class="wb-btn" id="btnAddFact">绑定事实</button>
          <button class="wb-btn" id="btnSeedDiag">从诊断补事实</button>
          <button class="wb-btn primary" id="btnGenerate">生成母稿</button>
          <button class="wb-btn" id="btnSave">保存母稿</button>
          <button class="wb-btn" id="btnCheck">检查就绪</button>
        </div>
      </div>
      <div class="wb-card">
        <strong>渠道适配（中国图文主渠道）</strong>
        <div class="wb-hint">母稿为唯一真相源；勾选平台后生成受控派生稿。默认：官网 + 公众号 + 知乎。</div>
        <div class="wb-channel-pick" id="channelPick"></div>
        <div class="wb-toolbar">
          <button class="wb-btn primary" id="btnVariants">生成所选渠道稿</button>
          <button class="wb-btn" id="btnCopyActive">复制当前渠道稿</button>
          <button class="wb-btn" id="btnSaveVariant" style="display:none">保存渠道稿编辑</button>
        </div>
        <div id="staleHint" class="wb-gate-bar" style="display:none;margin-top:8px"></div>
      </div>
      <div class="wb-grid wb-grid-2">
        <div class="wb-card">
          <div class="wb-tabs" id="docTabs"></div>
          <div class="wb-field">
            <label class="wb-label" id="titleLabel">母稿标题</label>
            <input class="wb-input" id="title">
          </div>
          <div class="wb-field">
            <label class="wb-label" id="bodyLabel">母稿 Markdown</label>
            <textarea class="wb-textarea" id="body"></textarea>
          </div>
          <div class="wb-muted" id="adaptMeta" style="margin-top:6px"></div>
        </div>
        <div class="wb-card">
          <strong>规则清单</strong>
          <ul class="wb-checks" id="checks" style="margin-top:10px"></ul>
          <div id="patchBox" style="margin-top:10px"></div>
          <div class="wb-muted" id="readyLine" style="margin-top:8px"></div>
          <button class="wb-btn" id="btnChannels" style="margin-top:10px;display:none">去回填 →</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/geo-sidebar-v1.js?rev=7"></script>
<script src="assets/geo-api-v1.js?rev=9"></script>
<script src="assets/geo-workbench-v1.js?rev=7"></script>
<script>
(async function () {
  GeoWB.renderAuthBar(document.getElementById('authBar'));
  var err = document.getElementById('err');
  var params = new URLSearchParams(location.search);
  var taskId = Number(params.get('task_id') || 0);
  var task = null;
  var allFacts = [];
  var profiles = [];
  var activeTab = 'master';
  var profileByKey = {};

  function variantMap() {
    var m = {};
    (task && task.variants || []).forEach(function (v) { m[v.channel] = v; });
    return m;
  }

  function selectedChannels() {
    return Array.prototype.slice.call(document.querySelectorAll('#channelPick input:checked'))
      .map(function (el) { return el.value; });
  }

  function renderChannelPick() {
    var box = document.getElementById('channelPick');
    box.innerHTML = '';
    var defaults = {};
    (task && task.target_channels || []).forEach(function (c) { defaults[c] = true; });
    if (!Object.keys(defaults).length) {
      profiles.forEach(function (p) { if (p.default_selected) defaults[p.key] = true; });
    }
    profiles.forEach(function (p) {
      profileByKey[p.key] = p;
      var label = document.createElement('label');
      var checked = !!defaults[p.key] || !!variantMap()[p.key];
      label.innerHTML = '<input type="checkbox" value="' + p.key + '"' + (checked ? ' checked' : '') + '> ' +
        p.display_name + ' <span class="wb-muted">(' + p.key + ')</span>';
      box.appendChild(label);
    });
  }

  function renderTabs() {
    var tabs = document.getElementById('docTabs');
    tabs.innerHTML = '';
    var items = [{ key: 'master', label: '母稿' }].concat(
      (task.variants || []).map(function (v) {
        var name = (profileByKey[v.channel] && profileByKey[v.channel].display_name) || v.channel;
        return { key: v.channel, label: name, stale: v.stale };
      })
    );
    if (activeTab !== 'master' && !variantMap()[activeTab]) activeTab = 'master';
    items.forEach(function (it) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'wb-tab' + (activeTab === it.key ? ' active' : '');
      btn.innerHTML = it.label + (it.stale ? '<span class="wb-stale">过期</span>' : '');
      btn.onclick = function () {
        activeTab = it.key;
        renderEditorPane();
        renderTabs();
      };
      tabs.appendChild(btn);
    });
  }

  function renderEditorPane() {
    var titleEl = document.getElementById('title');
    var bodyEl = document.getElementById('body');
    var meta = document.getElementById('adaptMeta');
    var stale = document.getElementById('staleHint');
    var saveVar = document.getElementById('btnSaveVariant');
    if (activeTab === 'master') {
      document.getElementById('titleLabel').textContent = '母稿标题';
      document.getElementById('bodyLabel').textContent = '母稿 Markdown';
      var article = task.article || {};
      titleEl.value = article.title || task.title || '';
      bodyEl.value = article.body_markdown || '';
      titleEl.readOnly = false;
      bodyEl.readOnly = false;
      meta.textContent = article.version_no ? ('母稿版本 #' + article.version_no) : '';
      stale.style.display = 'none';
      saveVar.style.display = 'none';
      return;
    }
    var v = variantMap()[activeTab];
    var pname = (profileByKey[activeTab] && profileByKey[activeTab].display_name) || activeTab;
    document.getElementById('titleLabel').textContent = pname + ' 标题';
    document.getElementById('bodyLabel').textContent = pname + ' 正文';
    titleEl.value = (v && v.title) || '';
    bodyEl.value = (v && v.body_markdown) || '';
    titleEl.readOnly = false;
    bodyEl.readOnly = false;
    saveVar.style.display = 'inline-block';
    var am = (v && v.adapt_meta) || {};
    meta.textContent = [
      am.profile_mode ? ('模式 ' + am.profile_mode) : '',
      am.dropped && am.dropped.length ? ('裁剪: ' + am.dropped.join(', ')) : '裁剪: 无',
      am.manually_edited ? '已人工改过' : '',
    ].filter(Boolean).join(' · ');
    if (v && v.stale) {
      stale.style.display = 'block';
      stale.textContent = '母稿已更新，当前「' + pname + '」渠道稿已过期，请重新生成该渠道。';
    } else {
      stale.style.display = 'none';
    }
  }

  function renderChecks(result) {
    var box = document.getElementById('checks');
    box.innerHTML = '';
    var checks = (result && result.checks) || (task && task.rule_result && task.rule_result.checks) || [];
    checks.forEach(function (c) {
      var li = document.createElement('li');
      li.innerHTML =
        '<span class="' + (c.passed ? 'wb-ok' : '') + '">' + (c.passed ? '✓' : '✗') + '</span>' +
        '<div><strong>' + c.code + '</strong> · ' + c.message +
        (c.passed ? '' : '<div class="wb-muted">' + (c.action || '') + '</div>') + '</div>';
      box.appendChild(li);
    });
    var ready = result ? result.ready : (task && task.rule_result && task.rule_result.ready);
    document.getElementById('readyLine').textContent = ready ? '已达发布就绪（渠道检查可另开）' : '尚未就绪';
    var patchBox = document.getElementById('patchBox');
    patchBox.innerHTML = '';
    var patches = (result && result.patches) || [];
    patches.forEach(function (p) {
      var btn = document.createElement('button');
      btn.className = 'wb-btn';
      btn.textContent = '插入修复 · ' + p.code;
      btn.onclick = async function () {
        try {
          var r = await GeoAPI.applyPatch(taskId, p.code);
          task = r.task;
          renderAll();
          renderChecks(r);
        } catch (e) { GeoWB.showError(err, e); }
      };
      patchBox.appendChild(btn);
    });
    document.getElementById('btnChannels').style.display = ready ? 'inline-block' : 'none';
  }

  function relevanceScore(fact, question) {
    var q = String(question || '').toLowerCase();
    if (!q) return 0;
    var hay = ((fact.title || '') + ' ' + (fact.statement || '') + ' ' + (fact.source_name || '')).toLowerCase();
    var score = 0;
    if (fact.meta && fact.meta.from_diagnosis) score += 100;
    if (hay.indexOf('诊断') >= 0) score += 20;
    q.replace(/[「」""''：:·|/\\-]/g, ' ').split(/\s+/).forEach(function (tok) {
      if (tok.length >= 2 && hay.indexOf(tok.toLowerCase()) >= 0) score += tok.length;
    });
    return score;
  }

  function renderFacts() {
    var chips = document.getElementById('factChips');
    chips.innerHTML = '<span class="wb-muted">已绑定事实：</span>';
    (task.facts || []).forEach(function (f) {
      var span = document.createElement('span');
      span.className = 'wb-chip';
      span.innerHTML = f.title + ' <button title="移除" data-id="' + f.id + '">×</button>';
      span.querySelector('button').onclick = async function () {
        var ids = (task.facts || []).map(function (x) { return x.id; }).filter(function (id) { return id !== f.id; });
        try {
          task = await GeoAPI.bindFacts(taskId, ids);
          renderAll();
        } catch (e) { GeoWB.showError(err, e); }
      };
      chips.appendChild(span);
    });
    if (!(task.facts || []).length && task.diagnosis_audit_id) {
      var tip = document.createElement('span');
      tip.className = 'wb-muted';
      tip.textContent = '（诊断任务可点「从诊断补事实」对齐标题）';
      chips.appendChild(tip);
    }
    var sel = document.getElementById('factSelect');
    sel.innerHTML = '';
    var bound = {};
    (task.facts || []).forEach(function (f) { bound[f.id] = true; });
    var question = task.prompt_question || task.title || '';
    allFacts
      .slice()
      .sort(function (a, b) { return relevanceScore(b, question) - relevanceScore(a, question); })
      .forEach(function (f) {
        if (bound[f.id]) return;
        var opt = document.createElement('option');
        opt.value = f.id;
        var mark = relevanceScore(f, question) >= 20 ? '★ ' : '';
        opt.textContent = mark + f.title + ' · ' + f.source_name;
        sel.appendChild(opt);
      });
  }

  function renderAll() {
    document.getElementById('taskStatus').innerHTML = GeoWB.statusBadge(task.status);
    GeoWB.renderPipeline(document.getElementById('pipelineBar'), task.pipeline_step || 'opportunity');
    var blocked = document.getElementById('blockedBar');
    if (task.blocked_reason) {
      blocked.style.display = 'block';
      blocked.textContent = '门禁未过：' + task.blocked_reason;
    } else {
      blocked.style.display = 'none';
    }
    var promptLine = '目标问题：' + (task.prompt_question || '-');
    if (task.diagnosis_audit_id) {
      promptLine += ' · 来自诊断 #' + task.diagnosis_audit_id;
    }
    document.getElementById('promptLine').textContent = promptLine;
    document.getElementById('btnSeedDiag').style.display = task.diagnosis_audit_id ? 'inline-block' : 'none';
    if (task.channel_profiles && task.channel_profiles.length) {
      profiles = task.channel_profiles;
    }
    renderChannelPick();
    renderTabs();
    renderEditorPane();
    renderFacts();
    renderChecks();
  }

  async function load() {
    GeoWB.clearError(err);
    try {
      var keyFromUrl = new URLSearchParams(location.search).get('api_key');
      if (keyFromUrl) GeoAPI.setApiKey(keyFromUrl);
      if (!taskId) {
        throw new Error('缺少 task_id。请从诊断中心「创建 GEO 内容任务」重新打开，或从 GEO 文章列表进入。');
      }
      GeoWB.requireTenant();
      try {
        profiles = ((await GeoAPI.listChannelProfiles()).items) || [];
      } catch (e) { profiles = []; }
      allFacts = (await GeoAPI.listFacts()).items || [];
      task = await GeoAPI.getTask(taskId);
      if (task.diagnosis_audit_id && !(task.facts || []).length) {
        task = await GeoAPI.seedDiagnosisFacts(taskId);
        allFacts = (await GeoAPI.listFacts()).items || [];
      }
      renderAll();
      if (task.article && task.article.body_markdown) {
        try {
          var result = await GeoAPI.checkTask(taskId, false);
          task = result.task;
          renderAll();
          renderChecks(result);
        } catch (checkErr) { /* keep */ }
      }
    } catch (e) { GeoWB.showError(err, e); }
  }

  document.getElementById('btnSeedDiag').onclick = async function () {
    try {
      task = await GeoAPI.seedDiagnosisFacts(taskId);
      allFacts = (await GeoAPI.listFacts()).items || [];
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnAddFact').onclick = async function () {
    var fid = Number(document.getElementById('factSelect').value);
    if (!fid) return;
    var ids = (task.facts || []).map(function (x) { return x.id; });
    if (ids.indexOf(fid) < 0) ids.push(fid);
    try {
      task = await GeoAPI.bindFacts(taskId, ids);
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnGenerate').onclick = async function () {
    try {
      task = await GeoAPI.generateTask(taskId);
      activeTab = 'master';
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnSave').onclick = async function () {
    try {
      if (activeTab !== 'master') {
        activeTab = 'master';
        renderEditorPane();
      }
      task = await GeoAPI.saveArticle(taskId, {
        title: document.getElementById('title').value,
        body_markdown: document.getElementById('body').value,
        outline: (task.article && task.article.outline) || {},
      });
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnSaveVariant').onclick = async function () {
    try {
      if (activeTab === 'master') return;
      task = await GeoAPI.patchVariant(taskId, activeTab, {
        title: document.getElementById('title').value,
        body_markdown: document.getElementById('body').value,
      });
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnCheck').onclick = async function () {
    try {
      var result = await GeoAPI.checkTask(taskId, false);
      task = result.task;
      renderAll();
      renderChecks(result);
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnVariants').onclick = async function () {
    try {
      var ch = selectedChannels();
      if (!ch.length) throw new Error('请至少勾选一个渠道');
      task = await GeoAPI.createVariants(taskId, ch);
      if (ch[0]) activeTab = ch[0];
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnCopyActive').onclick = async function () {
    try {
      var channel = activeTab === 'master' ? 'website' : activeTab;
      if (activeTab === 'master') {
        var t = document.getElementById('title').value;
        var b = document.getElementById('body').value;
        await navigator.clipboard.writeText('# ' + t + '\n\n' + b);
        alert('已复制母稿到剪贴板');
        return;
      }
      var data = await GeoAPI.exportVariant(taskId, channel);
      await navigator.clipboard.writeText('# ' + data.title + '\n\n' + data.body_markdown);
      alert('已复制 ' + channel + ' 版本到剪贴板');
      task = await GeoAPI.getTask(taskId);
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnChannels').onclick = function () {
    location.href = GeoWB.withDemoQuery('channels.html?task_id=' + taskId);
  };
  load();
})();
</script>
</body>
</html>
