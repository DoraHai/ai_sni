<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO 编辑器</title>
<link rel="stylesheet" href="assets/style.css?rev=geo-wb-1">
<link rel="stylesheet" href="assets/geo-workbench-v1.css?rev=1">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>在线编辑器</h1>
        <div class="sub">事实绑定 → 生成母稿 → 规则检查 → 渠道导出</div>
      </div>
      <div class="right" id="taskStatus"></div>
    </div>
    <div class="page">
      <div id="authBar" class="config-bar"></div>
      <div id="err" class="wb-error" style="display:none"></div>
      <div class="wb-card">
        <div class="wb-muted" id="promptLine">目标问题：-</div>
        <div style="margin-top:10px" id="factChips"></div>
        <div class="wb-toolbar">
          <select class="wb-select" id="factSelect" style="max-width:280px"></select>
          <button class="wb-btn" id="btnAddFact">绑定事实</button>
          <button class="wb-btn primary" id="btnGenerate">生成母稿</button>
          <button class="wb-btn" id="btnSave">保存</button>
          <button class="wb-btn" id="btnCheck">检查就绪</button>
          <button class="wb-btn" id="btnVariants">生成双渠道版</button>
          <button class="wb-btn" id="btnCopyWeb">复制官网版</button>
          <button class="wb-btn" id="btnCopyZhihu">复制知乎版</button>
        </div>
      </div>
      <div class="wb-grid wb-grid-2">
        <div class="wb-card">
          <div class="wb-field">
            <label class="wb-label">标题</label>
            <input class="wb-input" id="title">
          </div>
          <div class="wb-field">
            <label class="wb-label">正文 Markdown</label>
            <textarea class="wb-textarea" id="body"></textarea>
          </div>
        </div>
        <div class="wb-card">
          <strong>规则清单</strong>
          <ul class="wb-checks" id="checks" style="margin-top:10px"></ul>
          <div class="wb-muted" id="readyLine" style="margin-top:8px"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/geo-sidebar-v1.js?rev=1"></script>
<script src="assets/geo-api-v1.js?rev=1"></script>
<script src="assets/geo-workbench-v1.js?rev=1"></script>
<script>
(async function () {
  GeoWB.renderAuthBar(document.getElementById('authBar'));
  var err = document.getElementById('err');
  var params = new URLSearchParams(location.search);
  var taskId = Number(params.get('task_id') || 0);
  var task = null;
  var allFacts = [];

  function renderChecks(result) {
    var box = document.getElementById('checks');
    box.innerHTML = '';
    var checks = (result && result.checks) || (task && task.rule_result && task.rule_result.checks) || [];
    checks.forEach(function (c) {
      var li = document.createElement('li');
      li.innerHTML =
        '<span class="' + (c.passed ? 'wb-ok' : '') + '">' + (c.passed ? '✓' : '✗') + '</span>' +
        '<div><strong>' + c.code + '</strong> · ' + c.message +
        (c.passed ? '' : '<div class="wb-muted">' + (c.action || '') + '</div>') + '</div>';
      box.appendChild(li);
    });
    var ready = result ? result.ready : (task && task.rule_result && task.rule_result.ready);
    document.getElementById('readyLine').textContent = ready ? '已达发布就绪（渠道检查可另开）' : '尚未就绪';
  }

  function renderFacts() {
    var chips = document.getElementById('factChips');
    chips.innerHTML = '<span class="wb-muted">已绑定事实：</span>';
    (task.facts || []).forEach(function (f) {
      var span = document.createElement('span');
      span.className = 'wb-chip';
      span.innerHTML = f.title + ' <button title="移除" data-id="' + f.id + '">×</button>';
      span.querySelector('button').onclick = async function () {
        var ids = (task.facts || []).map(function (x) { return x.id; }).filter(function (id) { return id !== f.id; });
        try {
          task = await GeoAPI.bindFacts(taskId, ids);
          renderAll();
        } catch (e) { GeoWB.showError(err, e); }
      };
      chips.appendChild(span);
    });
    var sel = document.getElementById('factSelect');
    sel.innerHTML = '';
    var bound = {};
    (task.facts || []).forEach(function (f) { bound[f.id] = true; });
    allFacts.forEach(function (f) {
      if (bound[f.id]) return;
      var opt = document.createElement('option');
      opt.value = f.id;
      opt.textContent = f.title + ' · ' + f.source_name;
      sel.appendChild(opt);
    });
  }

  function renderAll() {
    document.getElementById('taskStatus').innerHTML = GeoWB.statusBadge(task.status);
    document.getElementById('promptLine').textContent = '目标问题：' + (task.prompt_question || '-');
    var article = task.article || {};
    document.getElementById('title').value = article.title || task.title || '';
    document.getElementById('body').value = article.body_markdown || '';
    renderFacts();
    renderChecks();
  }

  async function load() {
    GeoWB.clearError(err);
    if (!taskId) {
      GeoWB.showError(err, new Error('缺少 task_id，请从文章列表或机会池进入'));
      return;
    }
    try {
      GeoWB.requireTenant();
      allFacts = (await GeoAPI.listFacts()).items || [];
      task = await GeoAPI.getTask(taskId);
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  }

  document.getElementById('btnAddFact').onclick = async function () {
    var fid = Number(document.getElementById('factSelect').value);
    if (!fid) return;
    var ids = (task.facts || []).map(function (x) { return x.id; });
    if (ids.indexOf(fid) < 0) ids.push(fid);
    try {
      task = await GeoAPI.bindFacts(taskId, ids);
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnGenerate').onclick = async function () {
    try {
      task = await GeoAPI.generateTask(taskId);
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnSave').onclick = async function () {
    try {
      task = await GeoAPI.saveArticle(taskId, {
        title: document.getElementById('title').value,
        body_markdown: document.getElementById('body').value,
        outline: (task.article && task.article.outline) || {},
      });
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnCheck').onclick = async function () {
    try {
      var result = await GeoAPI.checkTask(taskId, false);
      task = result.task;
      renderAll();
      renderChecks(result);
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnVariants').onclick = async function () {
    try {
      task = await GeoAPI.createVariants(taskId, ['website', 'zhihu']);
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  };
  async function copyChannel(channel) {
    try {
      var data = await GeoAPI.exportVariant(taskId, channel);
      await navigator.clipboard.writeText('# ' + data.title + '\n\n' + data.body_markdown);
      alert('已复制 ' + channel + ' 版本到剪贴板');
      task = await GeoAPI.getTask(taskId);
      renderAll();
    } catch (e) { GeoWB.showError(err, e); }
  }
  document.getElementById('btnCopyWeb').onclick = function () { copyChannel('website'); };
  document.getElementById('btnCopyZhihu').onclick = function () { copyChannel('zhihu'); };
  load();
})();
</script>
</body>
</html>
