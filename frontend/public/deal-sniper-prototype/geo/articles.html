<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO 文章任务</title>
<link rel="stylesheet" href="assets/style.css?rev=geo-wb-2">
<link rel="stylesheet" href="assets/geo-workbench-v1.css?rev=6">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>GEO 文章</h1>
        <div class="sub">内容任务列表 · 进入编辑器完成生成与核验</div>
      </div>
      <div class="right">
        <a class="wb-btn" id="linkPrompts" href="prompts.html">从机会创建</a>
      </div>
    </div>
    <div class="page">
      <div id="authBar" class="config-bar"></div>
      <div id="err" class="wb-error" style="display:none"></div>
      <div class="wb-card">
        <div class="wb-toolbar">
          <strong>任务</strong>
          <input class="wb-input" id="filterQ" placeholder="搜索标题…" style="max-width:180px">
          <select class="wb-select" id="filterStatus">
            <option value="">全部状态</option>
            <option value="needs_fix">needs_fix</option>
            <option value="ready">ready</option>
            <option value="exported">exported</option>
            <option value="published">published</option>
            <option value="draft">draft</option>
            <option value="facts_bound">facts_bound</option>
            <option value="editing">editing</option>
          </select>
          <select class="wb-select" id="filterPipeline">
            <option value="">全部步骤</option>
            <option value="opportunity">提问缺口</option>
            <option value="evidence">证据注入</option>
            <option value="draft">生成编辑</option>
            <option value="adapt">渠道适配</option>
            <option value="publish">发布回填</option>
          </select>
          <select class="wb-select" id="filterDiag">
            <option value="">来源不限</option>
            <option value="1">仅诊断桥</option>
            <option value="0">非诊断</option>
          </select>
          <button class="wb-btn" id="btnReload">刷新</button>
        </div>
        <div class="wb-muted" id="filterHint" style="margin-bottom:8px"></div>
        <table class="wb-table">
          <thead><tr><th>ID</th><th>标题 / 问题</th><th>流水线</th><th>状态</th><th>门禁</th><th>更新时间</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="listEmpty" style="display:none"></div>
      </div>
    </div>
  </main>
</div>
<script src="assets/geo-sidebar-v1.js?rev=8"></script>
<script src="assets/geo-api-v1.js?rev=6"></script>
<script src="assets/geo-workbench-v1.js?rev=6"></script>
<script>
(async function () {
  GeoWB.renderAuthBar(document.getElementById('authBar'));
  document.getElementById('linkPrompts').href = GeoWB.withDemoQuery('prompts.html');
  var err = document.getElementById('err');
  var params = new URLSearchParams(location.search);
  if (params.get('status')) document.getElementById('filterStatus').value = params.get('status');
  if (params.get('pipeline_step')) document.getElementById('filterPipeline').value = params.get('pipeline_step');
  if (params.get('from_diagnosis') === '1' || params.get('from_diagnosis') === 'true') {
    document.getElementById('filterDiag').value = '1';
  } else if (params.get('from_diagnosis') === '0' || params.get('from_diagnosis') === 'false') {
    document.getElementById('filterDiag').value = '0';
  }

  async function load() {
    GeoWB.clearError(err);
    try {
      GeoWB.requireTenant();
      var query = {};
      var st = document.getElementById('filterStatus').value;
      var ps = document.getElementById('filterPipeline').value;
      var q = document.getElementById('filterQ').value;
      var diag = document.getElementById('filterDiag').value;
      if (st) query.status = st;
      if (ps) query.pipeline_step = ps;
      if (q) query.q = q;
      if (diag === '1') query.from_diagnosis = true;
      if (diag === '0') query.from_diagnosis = false;
      var data = await GeoAPI.listTasks(query);
      var items = data.items || [];
      document.getElementById('filterHint').textContent = '当前筛选命中 ' + items.length + ' 条';
      var tbody = document.getElementById('rows');
      var empty = document.getElementById('listEmpty');
      tbody.innerHTML = '';
      if (!items.length) {
        empty.style.display = 'block';
        GeoWB.renderEmpty(empty, '暂无任务 · 可从提问机会池创建，或去诊断中心桥接', { inline: true, showIcon: false });
        return;
      }
      empty.style.display = 'none';
      empty.innerHTML = '';
      items.forEach(function (t) {
        var tr = document.createElement('tr');
        var diagBadge = t.diagnosis_audit_id ? ' <span class="wb-badge">诊断</span>' : '';
        tr.innerHTML =
          '<td>' + t.id + '</td>' +
          '<td><div>' + (t.title || '') + diagBadge + '</div><div class="wb-muted">' + (t.prompt_question || '') + '</div></td>' +
          '<td>' + GeoWB.pipelineLabel(t.pipeline_step) + '</td>' +
          '<td>' + GeoWB.statusBadge(t.status) + '</td>' +
          '<td class="wb-muted">' + (t.blocked_reason || '-') + '</td>' +
          '<td class="wb-muted">' + (t.updated_at || '') + '</td>' +
          '<td><a class="wb-btn primary" href="' + GeoWB.withDemoQuery('editor.html?task_id=' + t.id) + '">打开</a></td>';
        tbody.appendChild(tr);
      });
    } catch (e) { GeoWB.showError(err, e); }
  }
  document.getElementById('btnReload').onclick = load;
  document.getElementById('filterStatus').onchange = load;
  document.getElementById('filterPipeline').onchange = load;
  document.getElementById('filterDiag').onchange = load;
  document.getElementById('filterQ').onchange = load;
  load();
})();
</script>
</body>
</html>
