<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO 文章任务</title>
<link rel="stylesheet" href="assets/style.css?rev=geo-wb-1">
<link rel="stylesheet" href="assets/geo-workbench-v1.css?rev=1">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>GEO 文章</h1>
        <div class="sub">内容任务列表 · 进入编辑器完成生成与核验</div>
      </div>
      <div class="right">
        <a class="wb-btn" href="prompts.html">从机会创建</a>
      </div>
    </div>
    <div class="page">
      <div id="authBar" class="config-bar"></div>
      <div id="err" class="wb-error" style="display:none"></div>
      <div class="wb-card">
        <div class="wb-toolbar">
          <strong>任务</strong>
          <button class="wb-btn" id="btnReload">刷新</button>
        </div>
        <table class="wb-table">
          <thead><tr><th>ID</th><th>标题 / 问题</th><th>状态</th><th>更新时间</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="assets/geo-sidebar-v1.js?rev=1"></script>
<script src="assets/geo-api-v1.js?rev=1"></script>
<script src="assets/geo-workbench-v1.js?rev=1"></script>
<script>
(async function () {
  GeoWB.renderAuthBar(document.getElementById('authBar'));
  var err = document.getElementById('err');
  async function load() {
    GeoWB.clearError(err);
    try {
      GeoWB.requireTenant();
      var data = await GeoAPI.listTasks();
      var tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      (data.items || []).forEach(function (t) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + t.id + '</td>' +
          '<td><div>' + (t.title || '') + '</div><div class="wb-muted">' + (t.prompt_question || '') + '</div></td>' +
          '<td>' + GeoWB.statusBadge(t.status) + '</td>' +
          '<td class="wb-muted">' + (t.updated_at || '') + '</td>' +
          '<td><a class="wb-btn primary" href="editor.html?tenant_id=' + GeoAPI.getTenantId() + '&task_id=' + t.id + '">打开</a></td>';
        tbody.appendChild(tr);
      });
    } catch (e) { GeoWB.showError(err, e); }
  }
  document.getElementById('btnReload').onclick = load;
  load();
})();
</script>
</body>
</html>
