<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 能力配置 · GEO</title>
<link rel="stylesheet" href="assets/style.css?rev=geo-wb-2">
<link rel="stylesheet" href="assets/geo-workbench-v1.css?rev=11">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>AI 能力配置</h1>
        <div class="sub">默认阿里云百炼（DashScope OpenAI 兼容）· Key 加密落库</div>
      </div>
    </div>
    <div class="page">
      <div id="authBar" class="config-bar"></div>
      <div id="err" class="wb-error" style="display:none"></div>
      <div class="wb-grid wb-grid-2">
        <div class="wb-card">
          <strong>接入配置</strong>
          <div class="wb-field" style="margin-top:12px">
            <label class="wb-label">提供商</label>
            <select class="wb-select" id="provider"></select>
            <div class="wb-hint" id="providerHint"></div>
          </div>
          <div class="wb-field">
            <label class="wb-label">Base URL</label>
            <input class="wb-input" id="baseUrl" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1">
          </div>
          <div class="wb-field">
            <label class="wb-label">模型</label>
            <input class="wb-input" id="model" placeholder="deepseek-v3">
          </div>
          <div class="wb-field">
            <label class="wb-label">API Key</label>
            <input class="wb-input" id="apiKey" type="password" autocomplete="off" placeholder="留空则保留已保存的 Key">
            <div class="wb-hint" id="keyHint">尚未配置 Key</div>
          </div>
          <div class="wb-field">
            <label class="wb-label"><input type="checkbox" id="enabled" checked> 启用 AI 能力</label>
          </div>
          <div class="wb-field">
            <label class="wb-label"><input type="checkbox" id="applyPreset"> 切换提供商时应用默认 Base URL / 模型</label>
          </div>
          <div class="wb-field">
            <label class="wb-label">备注</label>
            <input class="wb-input" id="note" placeholder="如：百炼北京地域 Key">
          </div>
          <div class="wb-toolbar" style="justify-content:flex-start;gap:8px">
            <button class="wb-btn primary" id="btnSave">保存</button>
            <button class="wb-btn" id="btnTest">测试连通</button>
            <button class="wb-btn" id="btnClear">清除 Key</button>
            <button class="wb-btn" id="btnReload">刷新</button>
          </div>
        </div>
        <div class="wb-card">
          <strong>当前生效</strong>
          <div id="effective" class="wb-muted" style="margin-top:12px;line-height:1.7"></div>
          <div class="wb-hint" style="margin-top:16px">
            推荐路径：阿里云百炼控制台 → API-KEY → 模型选择 DeepSeek-V3（或通义）。
            本页保存的 Key 经服务端加密存储；也可在服务器 `.env` 配置
            <code>DASHSCOPE_API_KEY</code> 作为兜底。
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/geo-sidebar-v1.js?rev=8"></script>
<script src="assets/geo-api-v1.js?rev=13"></script>
<script src="assets/geo-workbench-v1.js?rev=8"></script>
<script>
(async function () {
  GeoWB.renderAuthBar(document.getElementById('authBar'));
  var err = document.getElementById('err');
  var presets = [];
  var state = null;

  function findPreset(provider) {
    return presets.find(function (p) { return p.provider === provider; });
  }

  function fillProviders() {
    var sel = document.getElementById('provider');
    sel.innerHTML = '';
    presets.forEach(function (p) {
      var o = document.createElement('option');
      o.value = p.provider;
      o.textContent = p.label;
      sel.appendChild(o);
    });
  }

  function renderEffective(data) {
    var box = document.getElementById('effective');
    var e = data.effective || {};
    if (!e.enabled) {
      box.innerHTML = '未生效：尚未配置可用 Key。<br>请填写阿里云百炼 API Key 并保存。';
      return;
    }
    box.innerHTML =
      '状态：<span class="wb-badge good">可用</span><br>' +
      '来源：' + (e.source || '-') + '<br>' +
      '提供商：' + (e.provider || '-') + '<br>' +
      '模型：' + (e.model || '-') + '<br>' +
      'Base URL：' + (e.base_url || '-');
  }

  function applyForm(data) {
    state = data;
    presets = data.presets || [];
    fillProviders();
    document.getElementById('provider').value = data.provider || 'dashscope';
    document.getElementById('baseUrl').value = data.base_url || '';
    document.getElementById('model').value = data.model || '';
    document.getElementById('enabled').checked = !!data.enabled;
    document.getElementById('note').value = data.note || '';
    document.getElementById('apiKey').value = '';
    var hint = document.getElementById('keyHint');
    hint.textContent = data.api_key_configured
      ? ('已配置：' + (data.api_key_masked || '****'))
      : '尚未配置 Key';
    var p = findPreset(data.provider);
    document.getElementById('providerHint').textContent = p ? (p.hint || '') : '';
    renderEffective(data);
  }

  async function load() {
    GeoWB.clearError(err);
    try {
      GeoWB.requireTenant();
      var data = await GeoAPI.getAiSettings();
      applyForm(data);
    } catch (e) { GeoWB.showError(err, e); }
  }

  document.getElementById('provider').onchange = function () {
    var p = findPreset(this.value);
    document.getElementById('providerHint').textContent = p ? (p.hint || '') : '';
    if (document.getElementById('applyPreset').checked && p) {
      document.getElementById('baseUrl').value = p.base_url;
      document.getElementById('model').value = p.model;
    }
  };

  document.getElementById('btnReload').onclick = load;
  document.getElementById('btnSave').onclick = async function () {
    try {
      GeoWB.requireTenant();
      var body = {
        provider: document.getElementById('provider').value,
        base_url: document.getElementById('baseUrl').value || null,
        model: document.getElementById('model').value || null,
        enabled: document.getElementById('enabled').checked,
        note: document.getElementById('note').value || null,
        apply_preset: document.getElementById('applyPreset').checked,
      };
      var key = document.getElementById('apiKey').value.trim();
      if (key) body.api_key = key;
      var data = await GeoAPI.putAiSettings(body);
      applyForm(data);
      err.style.display = 'block';
      err.className = 'wb-muted';
      err.textContent = '已保存';
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnClear').onclick = async function () {
    if (!confirm('确认清除已保存的 API Key？')) return;
    try {
      var data = await GeoAPI.putAiSettings({
        provider: document.getElementById('provider').value,
        base_url: document.getElementById('baseUrl').value || null,
        model: document.getElementById('model').value || null,
        enabled: document.getElementById('enabled').checked,
        clear_api_key: true,
      });
      applyForm(data);
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnTest').onclick = async function () {
    try {
      GeoWB.requireTenant();
      var r = await GeoAPI.testAiSettings();
      err.style.display = 'block';
      err.className = 'wb-muted';
      err.textContent = '连通成功 · ' + (r.provider || '') + ' / ' + (r.model || '');
    } catch (e) { GeoWB.showError(err, e); }
  };

  document.getElementById('applyPreset').checked = true;
  load();
})();
</script>
</body>
</html>
