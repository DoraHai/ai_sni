<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分发平台 · GEO</title>
<link rel="stylesheet" href="assets/style.css?rev=geo-wb-2">
<link rel="stylesheet" href="assets/geo-workbench-v1.css?rev=10">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>分发平台</h1>
        <div class="sub">渠道稿导出 + Webhook 推送 / URL 回填（须审校通过 + 质量门禁）</div>
      </div>
    </div>
    <div class="page">
      <div id="authBar" class="config-bar"></div>
      <div id="err" class="wb-error" style="display:none"></div>
      <div id="reviewBar" class="wb-gate-bar" style="display:none;margin-bottom:12px"></div>
      <div id="visCta" class="wb-card" style="display:none;margin-bottom:12px">
        <strong>发布已回填</strong>
        <div class="wb-muted" style="margin:8px 0">建议登记该提问在 AI 引擎中的可见度结果。</div>
        <a class="wb-btn primary" id="btnGoVisibility" href="#">去登记可见度</a>
      </div>
      <div class="wb-card">
        <div class="wb-toolbar">
          <label class="wb-label" style="margin:0">选择任务</label>
          <select class="wb-select" id="taskSelect" style="max-width:420px"></select>
          <button class="wb-btn" id="btnReload">加载</button>
          <a class="wb-btn" id="btnEditor" href="#">回编辑器</a>
        </div>
        <table class="wb-table">
          <thead><tr><th>渠道</th><th>标题</th><th>状态</th><th>母稿同步</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="wb-card">
        <strong>官网/文档 Webhook 推送（Phase 2）</strong>
        <div class="wb-field" style="margin-top:12px">
          <label class="wb-label">Webhook 账号</label>
          <select class="wb-select" id="webhookAccount"></select>
        </div>
        <div class="wb-field">
          <label class="wb-label">可选发布 URL（CMS 未回传时填）</label>
          <input class="wb-input" id="webhookUrl" placeholder="https://">
        </div>
        <div class="wb-toolbar" style="justify-content:flex-start;gap:8px">
          <button class="wb-btn" id="btnPushDraft" type="button">推送草稿</button>
          <button class="wb-btn primary" id="btnPushPublish" type="button">推送发布</button>
        </div>
        <div class="wb-hint">仅 website/docs · auto_publish · auth_type=webhook；须先导出官网渠道稿且审校通过。</div>
        <div id="pushResult" class="wb-muted" style="margin-top:8px"></div>
      </div>
      <div class="wb-card">
        <strong>回填发布 URL</strong>
        <div class="wb-field" style="margin-top:12px">
          <label class="wb-label">渠道</label>
          <select class="wb-select" id="channel"></select>
        </div>
        <div class="wb-field">
          <label class="wb-label">发布链接</label>
          <input class="wb-input" id="url" placeholder="https://">
        </div>
        <div class="wb-field">
          <label class="wb-label">备注</label>
          <input class="wb-input" id="note" placeholder="已人工发布">
        </div>
        <button class="wb-btn primary" id="btnPublish">回填</button>
        <div id="pubs" class="wb-muted" style="margin-top:12px"></div>
      </div>
    </div>
  </main>
</div>
<script src="assets/geo-sidebar-v1.js?rev=9"></script>
<script src="assets/geo-api-v1.js?rev=17"></script>
<script src="assets/geo-workbench-v1.js?rev=8"></script>
<script>
(async function () {
  GeoWB.renderAuthBar(document.getElementById('authBar'));
  var err = document.getElementById('err');
  var task = null;
  var profileName = {};
  var webhookAccounts = [];
  var channelById = {};
  var REVIEW_LABELS = { none: '未提交审校', pending: '待审', approved: '已通过', rejected: '已驳回' };

  function label(channel) {
    return profileName[channel] || channel;
  }

  async function loadProfiles() {
    try {
      var data = await GeoAPI.listPublishingChannelOptions();
      var sel = document.getElementById('channel');
      sel.innerHTML = '';
      var seen = {};
      (data.items || []).forEach(function (opt) {
        var key = opt.adapt_key;
        if (!key || seen[key]) return;
        seen[key] = true;
        var name = (opt.adapt_profile && opt.adapt_profile.display_name) || opt.name || key;
        profileName[key] = name;
        var option = document.createElement('option');
        option.value = key;
        option.textContent = name + ' (' + key + ') · ' + (opt.publish_mode || '');
        sel.appendChild(option);
      });
      if (!sel.options.length) {
        var fallback = await GeoAPI.listChannelProfiles();
        (fallback.items || []).forEach(function (p) {
          profileName[p.key] = p.display_name;
          var option = document.createElement('option');
          option.value = p.key;
          option.textContent = p.display_name + ' (' + p.key + ')';
          sel.appendChild(option);
        });
      }
    } catch (e) { /* keep empty */ }
  }

  async function loadTasks() {
    GeoWB.requireTenant();
    var data = await GeoAPI.listTasks();
    var sel = document.getElementById('taskSelect');
    sel.innerHTML = '';
    (data.items || []).forEach(function (t) {
      var opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = '#' + t.id + ' · ' + (t.title || '') + ' · ' + t.status;
      sel.appendChild(opt);
    });
    var qTask = new URLSearchParams(location.search).get('task_id');
    if (qTask) sel.value = qTask;
  }

  async function loadWebhookAccounts() {
    var channels = (await GeoAPI.listPublishingChannels()).items || [];
    channelById = {};
    channels.forEach(function (c) { channelById[c.id] = c; });
    var accounts = (await GeoAPI.listChannelAccounts()).items || [];
    webhookAccounts = accounts.filter(function (a) {
      var ch = channelById[a.channel_id];
      return ch && ch.enabled && (ch.channel_type === 'website' || ch.channel_type === 'docs')
        && ch.publish_mode === 'auto_publish' && a.auth_type === 'webhook' && a.has_credentials;
    });
    var sel = document.getElementById('webhookAccount');
    sel.innerHTML = '';
    if (!webhookAccounts.length) {
      var empty = document.createElement('option');
      empty.value = '';
      empty.textContent = '暂无可用 Webhook 账号（去发布渠道配置）';
      sel.appendChild(empty);
      return;
    }
    webhookAccounts.forEach(function (a) {
      var ch = channelById[a.channel_id] || {};
      var opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = (ch.name || '渠道') + ' · ' + (a.display_name || ('#' + a.id));
      sel.appendChild(opt);
    });
  }

  async function pushWebhook(mode) {
    GeoWB.requireTenant();
    var id = Number(document.getElementById('taskSelect').value);
    var accountId = Number(document.getElementById('webhookAccount').value);
    if (!id) throw new Error('请选择任务');
    if (!accountId) throw new Error('请选择 Webhook 账号');
    var result = await GeoAPI.pushVariantWebhook(id, {
      channel: 'website',
      account_id: accountId,
      mode: mode,
      create_publication: mode === 'publish',
      published_url: document.getElementById('webhookUrl').value || null,
      note: mode === 'publish' ? 'webhook publish' : 'webhook draft',
    });
    document.getElementById('pushResult').textContent =
      '推送成功 · HTTP ' + (result.http_status || '-') +
      (result.remote_url ? (' · ' + result.remote_url) : '') +
      (result.publication_created ? ' · 已写回填' : ' · 未写回填');
    task = result.task || await GeoAPI.getTask(id);
    await loadDetail();
    if (result.publication_created && task && task.prompt_id) showVisibilityCta(task.prompt_id);
  }

  async function loadDetail() {
    GeoWB.clearError(err);
    try {
      var id = Number(document.getElementById('taskSelect').value);
      if (!id) return;
      task = await GeoAPI.getTask(id);
      document.getElementById('btnEditor').href = GeoWB.withDemoQuery('editor.html?task_id=' + id);
      var reviewBar = document.getElementById('reviewBar');
      var rs = task.review_status || 'none';
      reviewBar.style.display = 'block';
      reviewBar.textContent = '审校：' + (REVIEW_LABELS[rs] || rs) +
        (task.review_approved ? '（可回填）' : '（回填前须在编辑器审批通过）');
      var tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      (task.variants || []).forEach(function (v) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + label(v.channel) + '</td>' +
          '<td>' + v.title + '</td>' +
          '<td>' + GeoWB.statusBadge(v.status) + '</td>' +
          '<td>' + (v.stale ? '<span class="wb-badge warn">过期</span>' : '<span class="wb-badge good">同步</span>') + '</td>' +
          '<td><button class="wb-btn" data-ch="' + v.channel + '">复制</button></td>';
        tr.querySelector('button').onclick = async function () {
          try {
            if (!v.export_revision) throw new Error('请刷新稿件后重新导出');
            var data = await GeoAPI.exportVariant(task.id, v.channel, v.export_revision);
            await navigator.clipboard.writeText('# ' + data.title + '\n\n' + data.body_markdown);
            alert('已复制 ' + label(v.channel));
            task = await GeoAPI.getTask(task.id);
            await loadDetail();
          } catch (e) { GeoWB.showError(err, e); }
        };
        tbody.appendChild(tr);
      });
      var pubs = document.getElementById('pubs');
      if ((task.publications || []).length) {
        pubs.innerHTML = (task.publications || []).map(function (p) {
          return label(p.channel) + ' · ' + (p.published_url || '-') + ' · ' + (p.status || '');
        }).join('<br>');
      } else {
        pubs.textContent = '暂无回填记录';
      }
    } catch (e) { GeoWB.showError(err, e); }
  }

  document.getElementById('btnReload').onclick = loadDetail;
  document.getElementById('taskSelect').onchange = loadDetail;
  document.getElementById('btnPushDraft').onclick = function () {
    pushWebhook('draft').catch(function (e) { GeoWB.showError(err, e); });
  };
  document.getElementById('btnPushPublish').onclick = function () {
    pushWebhook('publish').catch(function (e) { GeoWB.showError(err, e); });
  };
  function showVisibilityCta(promptId) {
    var box = document.getElementById('visCta');
    var link = document.getElementById('btnGoVisibility');
    if (!promptId) {
      box.style.display = 'none';
      return;
    }
    box.style.display = 'block';
    link.href = GeoWB.withDemoQuery('visibility.html?prompt_id=' + promptId);
  }

  document.getElementById('btnPublish').onclick = async function () {
    try {
      GeoWB.requireTenant();
      var id = Number(document.getElementById('taskSelect').value);
      await GeoAPI.publish(id, {
        channel: document.getElementById('channel').value,
        published_url: document.getElementById('url').value,
        note: document.getElementById('note').value || null,
      });
      document.getElementById('url').value = '';
      await loadDetail();
      if (task && task.prompt_id) showVisibilityCta(task.prompt_id);
    } catch (e) { GeoWB.showError(err, e); }
  };

  try {
    await loadProfiles();
    await loadWebhookAccounts();
    await loadTasks();
    await loadDetail();
  } catch (e) { GeoWB.showError(err, e); }
})();
</script>
</body>
</html>
