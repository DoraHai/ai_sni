<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 引用次数 · GEO</title>
<link rel="stylesheet" href="assets/style.css?rev=geo-wb-2">
<link rel="stylesheet" href="assets/geo-workbench-v1.css?rev=11">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>AI 引用次数</h1>
        <div class="sub">由可见度快照 cited_urls 聚合 · 对照国内阵地蓝图（无自动抽取）</div>
      </div>
    </div>
    <div class="page">
      <div id="authBar" class="config-bar"></div>
      <div id="err" class="wb-error" style="display:none"></div>
      <div class="wb-card" style="margin-bottom:14px">
        <div class="wb-toolbar">
          <strong>引用覆盖</strong>
          <span class="wb-muted" id="summary">-</span>
          <a class="wb-btn" id="btnVis" href="#">去登记快照</a>
          <button class="wb-btn" id="btnReload">刷新</button>
        </div>
      </div>
      <div class="wb-card">
        <div class="wb-toolbar">
          <strong>域名聚合</strong>
        </div>
        <table class="wb-table">
          <thead>
            <tr>
              <th>域名</th>
              <th>出现次数</th>
              <th>关联提问</th>
              <th>引擎</th>
              <th>蓝图阵地</th>
              <th>全国引用参考</th>
              <th>样例 URL</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="listEmpty" style="display:none"></div>
      </div>
    </div>
  </main>
</div>
<script src="assets/geo-sidebar-v1.js?rev=9"></script>
<script src="assets/geo-api-v1.js?rev=13"></script>
<script src="assets/geo-workbench-v1.js?rev=8"></script>
<script>
(async function () {
  GeoWB.renderAuthBar(document.getElementById('authBar'));
  var err = document.getElementById('err');
  document.getElementById('btnVis').href = GeoWB.withDemoQuery('visibility.html');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function load() {
    GeoWB.clearError(err);
    try {
      GeoWB.requireTenant();
      var data = await GeoAPI.citationInsights();
      var items = data.items || [];
      var rate = data.own_domain_cite_rate;
      var rateLabel = rate == null ? '未配置官网域名' : ((Math.round(rate * 1000) / 10) + '%');
      document.getElementById('summary').textContent =
        '含引用快照 ' + (data.snapshots_with_citations || 0) +
        ' · 去重域名 ' + (data.distinct_cited_domains || 0) +
        ' · 自有域引用率 ' + rateLabel;

      var tbody = document.getElementById('rows');
      var empty = document.getElementById('listEmpty');
      tbody.innerHTML = '';
      if (!items.length) {
        empty.style.display = 'block';
        GeoWB.renderEmpty(empty, '暂无引用 URL · 在「AI 可见度」保存快照时粘贴回答中的引用链接', { inline: true, showIcon: false });
        return;
      }
      empty.style.display = 'none';
      empty.innerHTML = '';
      items.forEach(function (row) {
        var tr = document.createElement('tr');
        var own = row.is_own_domain ? ' <span class="wb-muted">(自有)</span>' : '';
        var bp = row.blueprint_channel_name
          ? esc(row.blueprint_channel_name) + (row.priority_band ? ' · ' + esc(row.priority_band) : '')
          : '-';
        var national = row.citation_national != null ? row.citation_national : '-';
        var samples = (row.sample_urls || []).map(function (u) {
          return '<div class="wb-muted" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(u) + '</div>';
        }).join('');
        tr.innerHTML =
          '<td><strong>' + esc(row.domain) + '</strong>' + own + '</td>' +
          '<td>' + row.cite_count + '</td>' +
          '<td>' + row.prompt_count + '</td>' +
          '<td class="wb-muted">' + esc((row.engines || []).join(', ')) + '</td>' +
          '<td class="wb-muted">' + bp + '</td>' +
          '<td class="wb-muted">' + national + '</td>' +
          '<td>' + (samples || '<span class="wb-muted">-</span>') + '</td>';
        tbody.appendChild(tr);
      });
    } catch (e) { GeoWB.showError(err, e); }
  }
  document.getElementById('btnReload').onclick = load;
  load();
})();
</script>
</body>
</html>
