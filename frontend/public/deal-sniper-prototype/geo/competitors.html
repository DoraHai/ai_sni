<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞品分析 · GEO</title>
<link rel="stylesheet" href="assets/style.css?rev=geo-wb-2">
<link rel="stylesheet" href="assets/geo-workbench-v1.css?rev=11">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>竞品分析</h1>
        <div class="sub">由可见度快照人工标注聚合 · Wave C（无自动巡检）</div>
      </div>
    </div>
    <div class="page">
      <div id="authBar" class="config-bar"></div>
      <div id="err" class="wb-error" style="display:none"></div>
      <div class="wb-card">
        <div class="wb-toolbar">
          <strong>竞品提及聚合</strong>
          <a class="wb-btn" id="btnVis" href="#">去登记快照</a>
          <button class="wb-btn" id="btnReload">刷新</button>
        </div>
        <table class="wb-table">
          <thead>
            <tr>
              <th>竞品</th>
              <th>出现次数</th>
              <th>关联提问</th>
              <th>引擎</th>
              <th>最近观测</th>
              <th>样例提问</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="listEmpty" style="display:none"></div>
      </div>
    </div>
  </main>
</div>
<script src="assets/geo-sidebar-v1.js?rev=9"></script>
<script src="assets/geo-api-v1.js?rev=12"></script>
<script src="assets/geo-workbench-v1.js?rev=7"></script>
<script>
(async function () {
  GeoWB.renderAuthBar(document.getElementById('authBar'));
  var err = document.getElementById('err');
  document.getElementById('btnVis').href = GeoWB.withDemoQuery('visibility.html');

  async function load() {
    GeoWB.clearError(err);
    try {
      GeoWB.requireTenant();
      var data = await GeoAPI.competitorInsights();
      var items = data.items || [];
      var tbody = document.getElementById('rows');
      var empty = document.getElementById('listEmpty');
      tbody.innerHTML = '';
      if (!items.length) {
        empty.style.display = 'block';
        GeoWB.renderEmpty(empty, '暂无竞品标注 · 在「AI 可见度」保存快照时填写竞品名', { inline: true, showIcon: false });
        return;
      }
      empty.style.display = 'none';
      empty.innerHTML = '';
      items.forEach(function (row) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><strong>' + row.name + '</strong></td>' +
          '<td>' + row.mention_count + '</td>' +
          '<td>' + row.prompt_count + '</td>' +
          '<td class="wb-muted">' + (row.engines || []).join(', ') + '</td>' +
          '<td class="wb-muted">' + (row.latest_captured_at || '-') + '</td>' +
          '<td class="wb-muted">' + (row.sample_prompt_question || '-') + '</td>';
        tbody.appendChild(tr);
      });
    } catch (e) { GeoWB.showError(err, e); }
  }
  document.getElementById('btnReload').onclick = load;
  load();
})();
</script>
</body>
</html>
