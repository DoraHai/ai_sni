<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事实库 · GEO</title>
<link rel="stylesheet" href="assets/style.css?rev=geo-wb-2">
<link rel="stylesheet" href="assets/geo-workbench-v1.css?rev=6">
</head>
<body>
<div class="layout">
  <aside class="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>事实库</h1>
        <div class="sub">信源分析入口 · Demo 先做带来源的事实卡</div>
      </div>
    </div>
    <div class="page">
      <div id="authBar" class="config-bar"></div>
      <div id="err" class="wb-error" style="display:none"></div>
      <div class="wb-grid wb-grid-2">
        <div class="wb-card">
          <div class="wb-toolbar">
            <strong>事实卡</strong>
            <input type="file" id="csvFile" accept=".csv" style="max-width:180px">
            <button class="wb-btn" id="btnImport">CSV 导入</button>
            <a class="wb-btn" href="assets/sample-facts.csv" download>下载样例 CSV</a>
            <button class="wb-btn" id="btnReload">刷新</button>
          </div>
          <div class="wb-hint">表头：title,statement,fact_type,source_name,source_url,observed_at,trust_level,author_name。样例含 10 条有效 + 2 条坏行，用于测行级错误。</div>
          <table class="wb-table">
            <thead><tr><th>标题</th><th>陈述</th><th>来源</th><th>作者</th><th>可信度</th><th>过期日</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <div id="listEmpty" style="display:none"></div>
        </div>
        <div class="wb-card">
          <strong>新建事实卡</strong>
          <div class="wb-field" style="margin-top:12px">
            <label class="wb-label">标题</label>
            <input class="wb-input" id="title" placeholder="如：私有化部署">
          </div>
          <div class="wb-field">
            <label class="wb-label">事实陈述</label>
            <textarea class="wb-textarea" id="statement" style="min-height:100px" placeholder="可被引用的完整陈述"></textarea>
          </div>
          <div class="wb-field">
            <label class="wb-label">来源名称（必填）</label>
            <input class="wb-input" id="source_name" placeholder="产品白皮书 2026">
          </div>
          <div class="wb-field">
            <label class="wb-label">来源 URL</label>
            <input class="wb-input" id="source_url" placeholder="https://">
          </div>
          <div class="wb-field">
            <label class="wb-label">过期日（可选）</label>
            <input class="wb-input" id="expires_at" type="date">
          </div>
          <div class="wb-field">
            <label class="wb-label">类型</label>
            <select class="wb-select" id="fact_type">
              <option value="product">product</option>
              <option value="case">case</option>
              <option value="metric">metric</option>
              <option value="policy">policy</option>
              <option value="other">other</option>
            </select>
          </div>
          <button class="wb-btn primary" id="btnCreate">创建</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="assets/geo-sidebar-v1.js?rev=8"></script>
<script src="assets/geo-api-v1.js?rev=6"></script>
<script src="assets/geo-workbench-v1.js?rev=6"></script>
<script>
(async function () {
  GeoWB.renderAuthBar(document.getElementById('authBar'));
  var err = document.getElementById('err');
  async function load() {
    GeoWB.clearError(err);
    err.className = 'wb-error';
    try {
      GeoWB.requireTenant();
      var data = await GeoAPI.listFacts();
      var tbody = document.getElementById('rows');
      var empty = document.getElementById('listEmpty');
      tbody.innerHTML = '';
      var items = data.items || [];
      if (!items.length) {
        empty.style.display = 'block';
        GeoWB.renderEmpty(empty, '暂无事实卡 · 可手动新建或 CSV 导入', { inline: true, showIcon: false });
        return;
      }
      empty.style.display = 'none';
      empty.innerHTML = '';
      items.forEach(function (f) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + f.title + '</td>' +
          '<td>' + f.statement + '</td>' +
          '<td>' + f.source_name + (f.source_url ? '<div class="wb-muted">' + f.source_url + '</div>' : '') + '</td>' +
          '<td>' + (f.author_name || '-') + '</td>' +
          '<td>' + f.trust_level + '</td>' +
          '<td class="wb-muted">' + (f.expires_at || '不过期') + '</td>' +
          '<td><button class="wb-btn" data-id="' + f.id + '">核验</button></td>';
        tr.querySelector('button').onclick = async function () {
          try {
            await GeoAPI.verifyFact(f.id);
            await load();
          } catch (e) { GeoWB.showError(err, e); }
        };
        tbody.appendChild(tr);
      });
    } catch (e) { GeoWB.showError(err, e); }
  }
  document.getElementById('btnReload').onclick = load;
  document.getElementById('btnImport').onclick = async function () {
    var file = document.getElementById('csvFile').files[0];
    if (!file) { GeoWB.showError(err, new Error('请选择 CSV 文件')); return; }
    try {
      var r = await GeoAPI.importFactsCsv(file);
      GeoWB.showImportResult(err, r);
      await load();
    } catch (e) { GeoWB.showError(err, e); }
  };
  document.getElementById('btnCreate').onclick = async function () {
    try {
      GeoWB.requireTenant();
      await GeoAPI.createFact({
        title: document.getElementById('title').value,
        statement: document.getElementById('statement').value,
        source_name: document.getElementById('source_name').value,
        source_url: document.getElementById('source_url').value || null,
        fact_type: document.getElementById('fact_type').value,
        trust_level: 'needs_review',
        expires_at: document.getElementById('expires_at').value || null,
      });
      document.getElementById('title').value = '';
      document.getElementById('statement').value = '';
      document.getElementById('expires_at').value = '';
      await load();
    } catch (e) { GeoWB.showError(err, e); }
  };
  load();
})();
</script>
</body>
</html>
