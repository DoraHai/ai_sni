<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>项目管理 · GEO 增长</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;color:#1f2937;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}.sidebar{height:100vh;position:sticky;top:0;padding:0 12px 18px;background:#fff;border-right:1px solid #e5e9f1;display:flex;flex-direction:column}.brand{min-height:76px;margin:0 -12px 10px;padding:17px 18px;border-bottom:1px solid #edf0f5;display:flex;align-items:center;gap:12px;font-weight:760}.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:850}.brand small{display:block;margin-top:3px;color:#9aa3b2;font-size:12px}.nav-group{margin:16px 10px 8px;color:#9aa3b2;font-size:12px;font-weight:760}.nav-item{min-height:36px;padding:8px 10px;border-radius:7px;color:#586274;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:650;text-decoration:none}.nav-item:hover,.nav-item.active{background:#eef4ff;color:#1d4ed8}.ico{width:22px;text-align:center}.spacer{flex:1}.back-link{padding:8px 10px;color:#7b8494;font-size:12px;font-weight:650;text-decoration:none}.stage{min-width:0}.topbar{min-height:60px;padding:0 26px;border-bottom:1px solid #e5e9f1;background:#fff;display:flex;align-items:center;justify-content:space-between}.crumb{color:#738094;font-size:13px}.crumb b{color:#1f2937}.tenant-select{height:34px;min-width:180px;padding:0 10px;border:1px solid #dbe3ed;border-radius:7px;background:#fff;color:#334155}.main{padding:26px;max-width:1200px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.head h1{margin:0 0 7px;font-size:24px}.head p{margin:0;color:#748196;font-size:13px}.primary,.secondary{height:36px;padding:0 16px;border-radius:7px;font-weight:700;cursor:pointer}.primary{border:0;background:#2563eb;color:#fff}.secondary{border:1px solid #d8e1eb;background:#fff;color:#475569}.panel{padding:20px;border:1px solid #e1e7ef;border-radius:12px;background:#fff;box-shadow:0 8px 22px rgba(31,52,77,.04)}.form-panel{display:none;margin-bottom:18px}.form-panel.open{display:block}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{color:#566579;font-size:12px;font-weight:700}.field input,.field textarea{width:100%;padding:9px 10px;border:1px solid #dbe3ed;border-radius:7px;font:inherit}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{padding:13px 12px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13px}th{color:#7d8999;font-size:11px;background:#f8fafc}.domain{color:#53657a}.status{display:inline-flex;padding:3px 8px;border-radius:10px;background:#e7f6ef;color:#17805e;font-size:11px}.empty{padding:44px;text-align:center;color:#97a3b2}.message{display:none;margin-bottom:14px;padding:10px 12px;border-radius:7px;font-size:12px}.message.show{display:block}.message.error{background:#fff0f0;color:#c24141}.message.ok{background:#ecf8f2;color:#147857}@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto}.form-grid{grid-template-columns:1fr}.main{padding:18px}.topbar{padding:12px 18px;align-items:flex-start;gap:10px}.gs-module-switcher{position:static!important}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><div class="logo">G</div><div>GEO 工作台<small>生成式引擎获客</small></div></div>
    <div class="nav-group">工作空间</div>
    <a class="nav-item active" href="projects.html"><span class="ico">◆</span>项目管理</a>
    <a class="nav-item" href="dashboard.html"><span class="ico">▦</span>GEO 概览</a>
    <a class="nav-item" href="visibility.html"><span class="ico">✦</span>AI 可见度</a>
    <div class="nav-group">内容与监测</div>
    <a class="nav-item" href="prompts.html"><span class="ico">◌</span>提问监控</a>
    <a class="nav-item" href="articles.html"><span class="ico">Aa</span>GEO 文章</a>
    <a class="nav-item" href="competitors.html"><span class="ico">≋</span>竞品分析</a>
    <div class="spacer"></div>
    <a class="back-link" href="/deal-sniper/portal">← 返回平台门户</a>
  </aside>
  <section class="stage">
    <header class="topbar">
      <div class="crumb">GEO 增长 / <b>项目管理</b></div>
      <select id="tenant-select" class="tenant-select" aria-label="选择 GEO 客户"></select>
    </header>
    <main class="main">
      <div class="head"><div><h1>网站与品牌项目</h1><p>一个客户可以维护多个 GEO 网站或品牌项目，项目始终归属于当前客户。</p></div><button id="open-form" class="primary">新建项目</button></div>
      <div id="message" class="message"></div>
      <section id="form-panel" class="panel form-panel">
        <form id="project-form">
          <div class="form-grid">
            <div class="field"><label for="name">项目名称</label><input id="name" maxlength="120" required placeholder="例如：官网 GEO 增长"></div>
            <div class="field"><label for="brand">品牌名称</label><input id="brand" maxlength="160" placeholder="例如：示例品牌"></div>
            <div class="field full"><label for="domain">网站域名</label><input id="domain" maxlength="255" required placeholder="www.example.com"></div>
            <div class="field full"><label for="description">项目说明</label><textarea id="description" rows="3" maxlength="4000" placeholder="可选"></textarea></div>
          </div>
          <div class="actions"><button id="cancel-form" type="button" class="secondary">取消</button><button class="primary" type="submit">保存项目</button></div>
        </form>
      </section>
      <section class="panel"><div id="project-list" class="empty">正在读取项目…</div></section>
    </main>
  </section>
</div>
<script>
(function(){
  var token=localStorage.getItem('sem_token')||sessionStorage.getItem('sem_token')||'';
  if(!token){location.assign('/login?redirect='+encodeURIComponent(location.href));return;}
  var tenantSelect=document.getElementById('tenant-select');
  var list=document.getElementById('project-list');
  var panel=document.getElementById('form-panel');
  var message=document.getElementById('message');
  function headers(json){var value={Accept:'application/json',Authorization:'Bearer '+token};if(json)value['Content-Type']='application/json';return value}
  function safe(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
  function notify(text,type){message.textContent=text;message.className='message show '+(type||'ok');setTimeout(function(){message.className='message'},3200)}
  function tenantId(){return Number(tenantSelect.value)||null}
  async function request(path,options){var response=await fetch(path,options||{headers:headers(false)});var data=await response.json().catch(function(){return{}});if(response.status===401){location.assign('/login?redirect='+encodeURIComponent(location.href));throw new Error('登录已失效')}if(!response.ok)throw new Error(data.detail||'请求失败');return data}
  async function loadProjects(){if(!tenantId()){list.innerHTML='<div class="empty">当前没有可用的 GEO 客户</div>';return}list.innerHTML='<div class="empty">正在读取项目…</div>';try{var data=await request('/api/v1/geo/projects?tenant_id='+tenantId(),{headers:headers(false)});var rows=data.projects||[];if(!rows.length){list.innerHTML='<div class="empty">还没有 GEO 项目，请先新建网站或品牌项目</div>';return}list.innerHTML='<table><thead><tr><th>项目</th><th>品牌</th><th>网站域名</th><th>状态</th></tr></thead><tbody>'+rows.map(function(row){return '<tr><td><b>'+safe(row.name)+'</b></td><td>'+safe(row.brand_name||'—')+'</td><td class="domain">'+safe(row.domain)+'</td><td><span class="status">'+safe(row.status)+'</span></td></tr>'}).join('')+'</tbody></table>'}catch(error){list.innerHTML='<div class="empty">'+safe(error.message)+'</div>'}}
  async function loadTenants(){try{var data=await request('/api/v1/auth/tenants?module=geo',{headers:headers(false)});var rows=data.tenants||[];var stored=Number(localStorage.getItem('geo_tenant_id')||sessionStorage.getItem('sem_tenant_id'))||null;tenantSelect.innerHTML=rows.map(function(row){return '<option value="'+row.id+'"'+(row.id===stored?' selected':'')+'>'+safe(row.name)+'</option>'}).join('');if(rows.length===1)tenantSelect.style.display='none';if(tenantId()){localStorage.setItem('geo_tenant_id',String(tenantId()));sessionStorage.setItem('sem_tenant_id',String(tenantId()))}await loadProjects()}catch(error){notify(error.message,'error')}}
  tenantSelect.addEventListener('change',function(){localStorage.setItem('geo_tenant_id',String(tenantId()));sessionStorage.setItem('sem_tenant_id',String(tenantId()));loadProjects()});
  document.getElementById('open-form').onclick=function(){panel.classList.add('open')};document.getElementById('cancel-form').onclick=function(){panel.classList.remove('open')};
  document.getElementById('project-form').onsubmit=async function(event){event.preventDefault();try{await request('/api/v1/geo/projects',{method:'POST',headers:headers(true),body:JSON.stringify({tenant_id:tenantId(),name:document.getElementById('name').value,brand_name:document.getElementById('brand').value||null,domain:document.getElementById('domain').value,description:document.getElementById('description').value||null})});event.target.reset();panel.classList.remove('open');notify('GEO 项目已创建');await loadProjects()}catch(error){notify(error.message,'error')}};
  loadTenants();
})();
</script>
<script src="assets/module-switcher-v1.js?rev=1"></script>
</body>
</html>
