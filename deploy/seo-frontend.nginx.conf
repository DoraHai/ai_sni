# SEO workspace is an independent, versioned frontend release.
location = /seo {
    return 308 /seo/;
}

location ^~ /seo/assets/ {
    root /opt/seo-frontend/current;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
}

location = /seo/index.html {
    root /opt/seo-frontend/current;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location /seo/ {
    root /opt/seo-frontend/current;
    try_files $uri $uri/ /seo/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# SEO API: independent process. Keep these locations before the general /api/ route.
location = /seo-health {
    proxy_pass http://127.0.0.1:8020/health/seo;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /api/v1/seo/ {
    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}
