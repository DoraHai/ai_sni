# SEO workspace is an independent, versioned frontend release.
location = /seo {
    return 308 /seo/;
}

location ^~ /seo/assets/ {
    root /opt/seo-frontend/current;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
}

location = /seo/index.html {
    root /opt/seo-frontend/current;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location /seo/ {
    root /opt/seo-frontend/current;
    try_files $uri $uri/ /seo/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
