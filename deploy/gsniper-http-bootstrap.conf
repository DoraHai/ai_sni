# Temporary HTTP-only vhost used to issue the first TLS certificate for the
# new canonical domain. Remove this file after deploy/nginx.conf is installed.
server {
    listen 80;
    server_name gsniper.snipers.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://gsniper.snipers.com.cn$request_uri;
    }
}
