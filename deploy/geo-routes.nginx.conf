# Diagnostic Center: independent frontend release.
# Nginx 1.20 does not inherit server-level add_header directives when a
# location defines Cache-Control. Keep the baseline headers repeated in every
# cache-aware Diagnostic Center and GEO location below.
location = /geo/diagnosis {
    return 302 /diagnostic-center/;
}

location = /diagnostic-center {
    return 301 /diagnostic-center/;
}

location = /diagnostic-center/ {
    rewrite ^ /diagnostic-center/index.html last;
}

location = /diagnostic-center/index.html {
    alias /opt/diagnostic-center/dist/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
}

location ^~ /diagnostic-center/assets/ {
    alias /opt/diagnostic-center/dist/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# GEO frontend: independent timestamped releases.
# Keep the portal's established prototype URL stable while serving the
# independently released GEO application inside the existing full-page iframe.
location = /deal-sniper-prototype/geo/dashboard.html {
    return 302 /deal-sniper/geo/dashboard.html;
}

location = /deal-sniper/geo {
    return 302 /deal-sniper/geo/dashboard.html;
}

location = /deal-sniper/geo/ {
    return 302 /deal-sniper/geo/dashboard.html;
}

# Vite fingerprints every GEO asset filename. Cache these immutable files
# independently from the HTML shell so repeat visits do not download the
# application bundle again.
location ^~ /deal-sniper/geo/assets/ {
    alias /opt/geo-frontend/current/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location ^~ /deal-sniper/geo/ {
    rewrite ^/deal-sniper/geo/([a-z0-9-]+)$ /deal-sniper/geo/$1.html last;
    alias /opt/geo-frontend/current/;
    index dashboard.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
}

# GEO API: independent process. Keep this before the general /api/ route.
# ⚠️ 禁止 proxy_set_header X-API-Key …（注入会把所有请求当成超管，RBAC 失效）。
# 浏览器走登录 JWT；脚本/运维才手动带 X-API-Key。
location = /geo-health {
    proxy_pass http://127.0.0.1:8010/health/geo;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /api/v1/geo/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}
