# Diagnostic Center: independent frontend release.
location = /geo/diagnosis {
    return 302 /diagnostic-center/;
}

location = /diagnostic-center {
    return 301 /diagnostic-center/;
}

location = /diagnostic-center/ {
    rewrite ^ /diagnostic-center/index.html last;
}

location = /diagnostic-center/index.html {
    alias /opt/diagnostic-center/dist/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location ^~ /diagnostic-center/assets/ {
    alias /opt/diagnostic-center/dist/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}

# GEO frontend: independent timestamped releases.
location = /deal-sniper/geo {
    return 302 /deal-sniper/geo/dashboard.html;
}

location = /deal-sniper/geo/ {
    return 302 /deal-sniper/geo/dashboard.html;
}

location ^~ /deal-sniper/geo/ {
    rewrite ^/deal-sniper/geo/([a-z0-9-]+)$ /deal-sniper/geo/$1.html last;
    alias /opt/geo-frontend/current/;
    index dashboard.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

# GEO API: independent process. Keep this before the general /api/ route.
location = /geo-health {
    proxy_pass http://127.0.0.1:8010/health/geo;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /api/v1/geo/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}
