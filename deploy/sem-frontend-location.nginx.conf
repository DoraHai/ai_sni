# 放在 sem.snipers.com.cn 的 HTTPS server 块内。
# 登录页是独立应用；必须写在 SEM 的 location / 之前。
location = /login {
    root /opt/auth-frontend/current;
    try_files /index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /login/ {
    return 308 /login$is_args$args;
}

location ^~ /auth-assets/ {
    alias /opt/auth-frontend/current/;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}

# SEM 主应用独立发布。
location ^~ /assets/ {
    root /opt/sem-frontend/current;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
}

location = /index.html {
    root /opt/sem-frontend/current;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location / {
    root /opt/sem-frontend/current;
    index index.html;
    try_files $uri $uri/ /index.html;
}
