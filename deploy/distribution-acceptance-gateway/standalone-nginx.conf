# Independent acceptance instance; never included by production nginx.conf.
user distacceptance distacceptance;
worker_processes 1;
pid /opt/gsnipers-distribution-acceptance-gateway/run/nginx.pid;
error_log /opt/gsnipers-distribution-acceptance-gateway/log/error.log crit;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 2m;
    client_body_buffer_size 64k;
    client_body_temp_path /opt/gsnipers-distribution-acceptance-gateway/tmp/body;
    proxy_temp_path /opt/gsnipers-distribution-acceptance-gateway/tmp/proxy;
    server {
        listen 0.0.0.0:58443 ssl;
        server_name gsnipers.snipers.com.cn;
        ssl_certificate /etc/letsencrypt/live/gsnipers.snipers.com.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gsnipers.snipers.com.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:acceptance_tls:1m;
        ssl_session_timeout 10m;
        if ($host != gsnipers.snipers.com.cn) { return 444; }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;

        # Device interfaces retain the existing private tunnel; this gateway is advisor UI only.
        location ^~ /api/distribution/v1/device/ { return 404; }
        location = /api/distribution/v1/device-pairings/claim { return 404; }
        location ^~ /api/distribution/v1/remote/device/ { return 404; }
        location ^~ /api/distribution/handoff/v1/device/ { return 404; }
        location ^~ /api/distribution/capabilities/v1/device/ { return 404; }

        location ^~ /customer-workbench/ {
            include /opt/gsnipers-distribution-acceptance-gateway/nginx-proxy.inc;
            proxy_pass https://127.0.0.1:55861;
        }
        location ^~ /api/v1/auth/ {
            include /opt/gsnipers-distribution-acceptance-gateway/nginx-proxy.inc;
            proxy_pass https://127.0.0.1:55861;
        }
        location ^~ /api/v1/seo/ {
            include /opt/gsnipers-distribution-acceptance-gateway/nginx-proxy.inc;
            proxy_pass https://127.0.0.1:55861;
        }
        location ^~ /api/distribution/ {
            include /opt/gsnipers-distribution-acceptance-gateway/nginx-proxy.inc;
            proxy_pass https://127.0.0.1:55861;
        }
        location = /acceptance/health {
            include /opt/gsnipers-distribution-acceptance-gateway/nginx-proxy.inc;
            proxy_pass https://127.0.0.1:55861;
        }
        location / { return 404; }
    }
}
