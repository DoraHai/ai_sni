# Include directly in the platform HTTPS server, independently of GEO snippets.
# Public lead entry is released with the diagnostic frontend, not the SEM app.
location = /diagnosis {
    alias /opt/diagnostic-center/dist/free.html;
    default_type text/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
}
location = /diagnosis/ {
    return 302 /diagnosis$is_args$args;
}

location ^~ /api/v1/diagnostic/ {
    proxy_pass http://127.0.0.1:8012;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}
