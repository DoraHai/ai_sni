# Legacy SEM host. The canonical application and public website now share
# https://gsnipers.snipers.com.cn. Keep this file installed as sem.conf during
# the compatibility window so bookmarks retain their path and query string.
server {
    listen 80;
    server_name sem.snipers.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://gsnipers.snipers.com.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sem.snipers.com.cn;

    ssl_certificate /etc/letsencrypt/live/sem.snipers.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sem.snipers.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Temporary compatibility for OAuth requests created before the provider
    # callback was changed. Remove after the new callback completes a real test.
    location = /api/oauth/baidu/callback {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 308 https://gsnipers.snipers.com.cn$request_uri;
    }
}
