server {
    listen 80;
    server_name sem.snipers.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sem.snipers.com.cn;

    ssl_certificate /etc/letsencrypt/live/sem.snipers.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sem.snipers.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/sem-access.log;
    error_log  /var/log/nginx/sem-error.log;

    client_max_body_size 16m;

    # 诊断中心独立前端：与主平台同域，但拥有单独构建和发布目录。
    location = /geo/diagnosis {
        return 302 /diagnostic-center/;
    }

    location = /diagnostic-center {
        return 301 /diagnostic-center/;
    }

    location = /diagnostic-center/ {
        rewrite ^ /diagnostic-center/index.html last;
    }

    location = /diagnostic-center/index.html {
        alias /opt/diagnostic-center/dist/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /diagnostic-center/assets/ {
        alias /opt/diagnostic-center/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ⚠️ 禁止在此注入 X-API-Key / Authorization 固定密钥（否则 RBAC 失效）。
    # 前端生产构建不得内嵌 VITE_API_KEY；用户登录后带 JWT。
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
