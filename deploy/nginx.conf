server {
    listen 80;
    server_name sem.snipers.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sem.snipers.com.cn;

    ssl_certificate /etc/letsencrypt/live/sem.snipers.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sem.snipers.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/sem-access.log;
    error_log  /var/log/nginx/sem-error.log;
    client_max_body_size 16m;

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 百度服务器直接访问的 OAuth 回调，不经过前端登录页。
    location /api/oauth/baidu/callback {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GEO 独立前端和 API，不与 SEM 主前端共同发布。
    include /etc/nginx/snippets/geo-routes.conf;

    # 应用层负责 JWT / X-API-Key 鉴权，Nginx 只透传。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Growth Sniper 官网保持独立构建和发布目录。
    location = /growth-sniper {
        alias /opt/growth-sniper/dist/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /growth-sniper/ {
        return 301 /growth-sniper;
    }

    location ^~ /growth-sniper/assets/ {
        alias /opt/growth-sniper/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ^~ /growth-sniper/landing/ {
        alias /opt/growth-sniper/dist/landing/;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    location = /growth-sniper/favicon-v2.png {
        alias /opt/growth-sniper/dist/favicon-v2.png;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # 公共登录入口独立构建和发布，避免发布登录页覆盖业务模块。
    location = /login {
        root /opt/auth-frontend/current;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /login/ {
        return 308 /login$is_args$args;
    }

    location ^~ /auth-assets/ {
        alias /opt/auth-frontend/current/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # SEM 的 Vite 文件名包含内容哈希，可长期缓存。
    location ^~ /assets/ {
        root /opt/sem-frontend/current;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html 每次发布都会变化，禁止长期缓存。
    location = /index.html {
        root /opt/sem-frontend/current;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SEM 后台路由属于同一个版本化 SPA，登录页由上面的独立应用处理。
    location / {
        root /opt/sem-frontend/current;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
