server {
    listen 80;
    server_name gsnipers.snipers.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://gsnipers.snipers.com.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name gsnipers.snipers.com.cn;

    ssl_certificate /etc/letsencrypt/live/gsnipers.snipers.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gsnipers.snipers.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/gsnipers-access.log;
    error_log /var/log/nginx/gsnipers-error.log;
    client_max_body_size 50m;

    # Public website remains the owner of /, /news, /contact and static pages.
    root /home/admin/gsnipers/site;
    index index.html;

    # The CMS owns /admin. Preserve the old SEM compatibility path as an exact
    # redirect so it cannot be swallowed by the broader CMS location.
    location = /admin/internal {
        return 308 /settings/accounts;
    }

    location ^~ /admin {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/oauth/baidu/callback {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GEO and SEO use independent processes and release directories.
    include /etc/nginx/snippets/geo-routes.conf;
    include /etc/nginx/snippets/seo-frontend.conf;
    include /etc/nginx/snippets/sem-login-rate-limit-location.conf;

    # Platform APIs are deliberately more specific than the CMS /api prefix.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location ^~ /api/oauth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location ^~ /api/baidu/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location = /login {
        root /opt/auth-frontend/current;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /login/ {
        return 308 /login$is_args$args;
    }

    location ^~ /auth-assets/ {
        alias /opt/auth-frontend/current/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # The public website uses /_nuxt and /landing, leaving /assets to SEM.
    location ^~ /assets/ {
        root /opt/sem-frontend/current;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /sem-index.html {
        alias /opt/sem-frontend/current/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Only declared business routes enter the SEM SPA. This preserves the
    # website homepage and article routes. More-specific GEO/SEO paths above win.
    location ~ ^/(assistant|onboarding|monitor|optimize|verify|manage|delivery|settings|workspace|sem)(/|$) {
        root /opt/sem-frontend/current;
        try_files $uri /sem-index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ ^/(deal-sniper|diagnosis)(/|$) {
        root /opt/sem-frontend/current;
        try_files $uri /sem-index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /growth-sniper {
        return 308 /;
    }

    location = /growth-sniper/ {
        return 308 /;
    }

    # Website lead/CMS endpoints retain their current routing and rate limits.
    location = /api/lead-code/send {
        limit_req zone=gsnipers_lead_send_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/leads {
        limit_req zone=gsnipers_lead_submit_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /content-manager {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /content-type-builder {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /upload {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /i18n {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /content-releases {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /review-workflows {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    error_page 404 /404.html;

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        try_files $uri $uri/ =404;
    }
}
