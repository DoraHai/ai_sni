server {
    listen 80;
    server_name gsnipers.snipers.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name gsnipers.snipers.com.cn;

    ssl_certificate /etc/letsencrypt/live/gsnipers.snipers.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gsnipers.snipers.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/gsnipers-access.log;
    error_log /var/log/nginx/gsnipers-error.log;

    location = / {
        alias /opt/growth-sniper/dist/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /index.html {
        alias /opt/growth-sniper/dist/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /growth-sniper {
        return 301 /;
    }

    location = /growth-sniper/ {
        return 301 /;
    }

    location ^~ /growth-sniper/assets/ {
        alias /opt/growth-sniper/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ^~ /growth-sniper/landing/ {
        alias /opt/growth-sniper/dist/landing/;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    location = /growth-sniper/favicon-v2.png {
        alias /opt/growth-sniper/dist/favicon-v2.png;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    location = /diagnosis {
        return 302 https://sem.snipers.com.cn/diagnosis$is_args$args;
    }

    location / {
        return 404;
    }
}
